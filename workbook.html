<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basic Spanish – Workbooks</title>
<style>
:root{
  --ink:#1D2B3A; --muted:#5D6B78; --desk:#DCE6ED; --paper:#fff;
  --peach:#F9C394; --sky:#A8D8E6; --leaf:#C6DE98; --rose:#EDB8BE; --lilac:#D8CDEB; --sun:#FFE97A;
  --hi:#FFF200; --warn:#B4410B; --ok:#1E7A4C; --line:#C9D5DE;
  --font:'Century Gothic','Questrial','Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--desk);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:3px solid #2F6FD6;outline-offset:2px}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}

/* ---------- Library ---------- */
#library{overflow-y:auto;background:var(--paper)}
.lib-head{padding:22px 20px 8px;max-width:960px;width:100%;margin:0 auto}
.lib-head h1{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.01em}
.lib-head p{margin:6px 0 0;color:var(--muted);font-size:15px}
.lib-head .back{display:inline-flex;align-items:center;gap:6px;margin:0 0 14px -6px;padding:6px;border-radius:8px;font-size:15px;font-weight:700}
.note{display:flex;align-items:flex-start;gap:8px;margin:14px 0 0;padding:10px 12px;border-radius:10px;background:#FFF9D6;font-size:14px}
.note svg{flex:none;margin-top:1px}
.note span{flex:1}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px;padding:18px 20px 30px;max-width:960px;width:100%;margin:0 auto}
.book{display:flex;flex-direction:column;gap:8px;text-align:left}
.cover{position:relative;aspect-ratio:4/5;border-radius:4px 10px 10px 4px;background:var(--c);padding:10px;
  box-shadow:inset 7px 0 0 rgba(0,0,0,.10), 0 2px 0 rgba(29,43,58,.12);transition:transform .15s}
.book:active .cover{transform:scale(.97)}
.cover .frame{height:100%;border:2px solid var(--ink);background:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 6px 10px}
.cover .es{font-size:17px;letter-spacing:.04em}
.cover .num{font-size:72px;line-height:.9;font-weight:700}
.cover .term{font-size:13px;font-weight:700;background:var(--ink);color:#fff;padding:3px 9px;border-radius:20px}
.cover .lock{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.book.soon .cover{background:#EEF2F5;box-shadow:none;border:2px dashed var(--line)}
.book.soon .frame{border-color:#AEBBC6;color:#8A98A5;background:none}
.book.soon .term{background:#AEBBC6}
.book .title{font-size:15px;font-weight:700;line-height:1.25}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);line-height:1.3}
.chip.open{color:var(--ok)} .chip.warn{color:var(--warn);font-weight:700}
.lib-foot{padding:4px 20px 40px;max-width:960px;width:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.lib-foot button{text-decoration:underline;font-size:13px;color:var(--muted);padding:6px}

/* ---------- Reader ---------- */
#reader{background:var(--desk)}
.topbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar .grow{flex:1;display:flex;justify-content:center;align-items:center;gap:2px;min-width:0}
.ibtn{width:38px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.ibtn:active{background:#EEF2F5}
.ibtn:disabled{opacity:.3}
.pagebtn{display:flex;align-items:center;gap:4px;height:42px;padding:0 8px;font-variant-numeric:tabular-nums;border-radius:12px;font-weight:700;font-size:15px;white-space:nowrap}
.pagebtn:active{background:#EEF2F5}
.zbtn{display:flex;align-items:center;gap:3px;height:42px;padding:0 8px;border-radius:12px;font-weight:700;font-size:14px;flex:none;font-variant-numeric:tabular-nums}
.zbtn:active{background:#EEF2F5}
.backbtn{flex:none;display:flex;align-items:center;gap:4px;height:42px;padding:0 10px 0 4px;border-radius:12px;font-weight:700;font-size:15px}
#stage{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
#pagewrap{position:relative;margin:10px auto 16px;background:#fff;box-shadow:0 1px 2px rgba(29,43,58,.18),0 6px 18px rgba(29,43,58,.10)}
#pagewrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#live{touch-action:none}
.move #live{pointer-events:none}
#texts{position:absolute;inset:0;pointer-events:none}
.textmode #texts{pointer-events:auto;cursor:text}
.tb{position:absolute;display:flex;align-items:flex-start;pointer-events:none;transform:translateY(-50%)}
.textmode .tb{pointer-events:auto}
.tb .tx{min-width:1.2em;padding:0 .15em;line-height:1.25;white-space:pre;outline:none;-webkit-user-select:text;user-select:text;font-family:'Comic Sans MS','Chalkboard SE','Comic Neue',var(--font);border-radius:4px}
.textmode .tb .tx{background:rgba(255,242,0,.18);box-shadow:0 0 0 1px rgba(47,111,214,.35)}
.tb .grip,.tb .del{display:none;width:26px;height:26px;border-radius:50%;flex:none;place-items:center;font-size:15px;line-height:1;color:#fff}
.textmode .tb.focus .grip{display:grid;background:#2F6FD6;margin-right:4px;touch-action:none;cursor:move}
.textmode .tb.focus .del{display:grid;background:#C0392B;margin-left:4px}
.status{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:15px;padding:20px}
.status button{text-decoration:underline;color:var(--ink);font-weight:700}

.tools{background:var(--paper);border-top:1px solid var(--line);padding:6px 8px 8px}
.palette{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:4px 4px 8px;scrollbar-width:none}
.palette::-webkit-scrollbar{display:none}
.sw{width:30px;height:30px;border-radius:50%;flex:none;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.sizes{display:flex;gap:2px;margin-left:6px;padding-left:10px;border-left:1px solid var(--line)}
.sz{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz.on{background:var(--hi)}
.toolrow{display:flex;justify-content:space-between;align-items:center;gap:2px;max-width:560px;margin:0 auto}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;border-radius:12px;font-size:11.5px;font-weight:700;color:var(--muted);min-width:0}
.tool.on{color:var(--ink);background:var(--hi)}
.tool:disabled{opacity:.3}
.sep{width:1px;height:34px;background:var(--line);flex:none}

/* ---------- Sheet (modal) ---------- */
#scrim{position:fixed;inset:0;background:rgba(29,43,58,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#sheet{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom,0));animation:up .2s ease-out}
@media (min-width:700px){#scrim{align-items:center}#sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
#sheet h2{margin:0 0 6px;font-size:21px;line-height:1.2}
#sheet p{margin:0 0 14px;color:var(--muted);font-size:15px;line-height:1.45}
.field{display:block;width:100%;font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;margin:0 0 12px;-webkit-user-select:text;user-select:text}
.field:focus{border-color:var(--ink);outline:none}
.durs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.dur{padding:9px 14px;border-radius:20px;border:2px solid var(--line);font-size:14px;font-weight:700}
.dur.on{border-color:var(--ink);background:var(--hi)}
.lbl{font-size:13px;font-weight:700;margin:4px 0 8px;color:var(--ink)}
.btn{display:flex;width:100%;justify-content:center;align-items:center;gap:8px;padding:14px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:16px}
.btn.ghost{background:#EEF2F5;color:var(--ink);margin-top:8px}
.btn.danger{background:#C0392B}
.err{color:#C0392B;font-size:14px;font-weight:700;margin:-4px 0 12px;min-height:1px}
.toc{list-style:none;margin:0 0 16px;padding:0}
.toc button{display:flex;width:100%;align-items:baseline;gap:10px;padding:11px 4px;border-bottom:1px solid #EEF2F5;text-align:left;font-size:15px}
.toc .t{flex:1}
.toc .unit{font-size:13px;font-weight:700;color:var(--muted);padding:12px 4px 2px}
.toc .pg{color:var(--muted);font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pgrid button{position:relative;height:40px;border-radius:10px;background:#EEF2F5;font-weight:700;font-variant-numeric:tabular-nums}
.pgrid button.cur{background:var(--ink);color:#fff}
.pgrid button.done::after{content:"";position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:#2F6FD6}
.trow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EEF2F5}
.trow .n{flex:1;font-weight:700;font-size:15px}
.trow .s{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.trow button{padding:8px 12px;border-radius:10px;background:#EEF2F5;font-weight:700;font-size:13px}

#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,440px);z-index:30;display:flex;gap:8px;align-items:flex-start;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast span{flex:1}
.slide-l{animation:sl .22s ease-out}.slide-r{animation:sr .22s ease-out}
@keyframes sl{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes sr{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body *{display:none!important}body::after{content:"Printing is not available for this workbook.";display:block;padding:40px;font-size:20px}}
</style>
</head>
<body>

<!-- ======================= LIBRARY ======================= -->
<section id="library" class="screen">
  <div class="lib-head">
    <h1>Libros | Workbooks</h1>
    <p>Write your answers right on the page. Your work is saved on this phone.</p>
    <div class="note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>To unlock, see your Spanish teacher at OHPIS.</span></div>
  </div>
  <div class="shelf" id="shelf"></div>
  <div class="lib-foot"><span id="who"></span><button id="teacherBtn">Teacher</button></div>
</section>

<!-- ======================= READER ======================= -->
<section id="reader" class="screen move" hidden>
  <div class="topbar">
    <button class="backbtn" id="toLib" aria-label="Back to workbooks"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>Books</span></button>
    <div class="grow">
      <button class="ibtn" id="prev" aria-label="Previous page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="pagebtn" id="pageBtn" aria-label="Contents and pages"><span id="pageLbl">1 / 30</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="ibtn" id="next" aria-label="Next page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <button class="zbtn" id="zoom" aria-label="Zoom"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-4-4"/></svg><span id="zLbl">1×</span></button>
  </div>

  <div id="stage">
    <div id="pagewrap">
      <canvas id="bg"></canvas>
      <canvas id="ink"></canvas>
      <canvas id="live"></canvas>
      <div id="texts"></div>
      <div class="status" id="status" hidden></div>
    </div>
  </div>

  <div class="tools">
    <div class="palette" id="palette" hidden></div>
    <div class="toolrow">
      <button class="tool on" data-tool="move"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11.5v-2a1.5 1.5 0 0 1 3 0V12"/><path d="M14 10.5a1.5 1.5 0 0 1 3 0V12"/><path d="M17 11.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-2a6 6 0 0 1-5-2.7L4.3 15a1.6 1.6 0 0 1 2.6-1.9L8 14.5"/></svg>Move</button>
      <button class="tool" data-tool="pen"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Pencil</button>
      <button class="tool" data-tool="marker"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>Paint</button>
      <button class="tool" data-tool="text"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Type</button>
      <button class="tool" data-tool="eraser"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8l-5-5a2 2 0 0 1 0-2.8L12.2 3a2 2 0 0 1 2.8 0l5 5a2 2 0 0 1 0 2.8L11 20"/><path d="M6 11l7 7"/></svg>Eraser</button>
      <span class="sep"></span>
      <button class="tool" id="undo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
      <button class="tool" id="clear"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg>Clear</button>
    </div>
  </div>
</section>

<div id="scrim" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script>
/* =====================================================================
   BASIC SPANISH – DIGITAL WORKBOOKS (prototype)
   Mr. Hernández · Old Harbour Primary School
   ===================================================================== */

// SHA-256 of the teacher password (prototype password: profe123).
const TEACHER_HASH = '25da2ece06d8767eccaff139d4ba7490dd1b9aeeb51f413de23bce797cc47e68';
const KEY = new TextEncoder().encode('BasicSpanish-OHPIS-Hernandez');
const PAGE_RATIO = 1725 / 1242;                // height / width of every page image
const C = { g1:'var(--peach)', g2:'var(--sky)', g3:'var(--leaf)', g4:'var(--rose)', g5:'var(--lilac)', g6:'var(--sun)' };

// The 13 workbooks. Only Grade 1 Term 1 has pages in this prototype.
const BOOKS = [
  {id:'g1t1', grade:1, term:1, pages:31, ready:true, toc:[
    {unit:'Unit 1. Introducing oneself'},
    {t:'Saludos / Greetings', p:2}, {t:'Yo soy… / I am…', p:10}, {t:'Números 1 al 10 / Numerals 1 to 10', p:14},
    {t:'Colores / Colours', p:17}, {t:'Alfabeto / Alphabet', p:20}, {t:'Comandos / Commands', p:23},
    {unit:'Unit 2. Describing oneself and others'},
    {t:'El cuerpo / The body', p:24}, {t:'La cabeza / The head', p:27}, {t:'Comandos / Commands', p:29},
    {unit:'More'}, {t:'Tareas / Homework', p:30}
  ]},
  {id:'g1t2',grade:1,term:2},{id:'g1t3',grade:1,term:3},
  {id:'g2t1',grade:2,term:1},{id:'g2t2',grade:2,term:2},{id:'g2t3',grade:2,term:3},
  {id:'g3t1',grade:3,term:1},{id:'g3t2',grade:3,term:2},
  {id:'g4t1',grade:4,term:1},{id:'g4t2',grade:4,term:2},{id:'g4t3',grade:4,term:3},
  {id:'g5t1',grade:5,term:1},{id:'g6t1',grade:6,term:1}
];
const PALETTE = [
  ['#1F4E9C','azul'],['#1D2B3A','negro'],['#D62828','rojo'],['#1E9E4A','verde'],['#FFD60A','amarillo'],
  ['#F77F00','anaranjado'],['#E83E8C','rosado'],['#7B4FB0','morado'],['#7A4A2A','marrón'],['#FFFFFF','blanco']
];
const SIZES = { pen:[.0035,.006,.011], marker:[.018,.03,.05] };
const DURS = [['1 month',1],['3 months',3],['6 months',6],['1 year',12],['Forever',0]];
const DAY = 864e5;

/* ---------- storage helpers ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ toast('Storage is full. Your last change could not be saved.'); return false; } }
};
const unlocks = () => store.get('bs_wb_unlocks', {});
function unlockInfo(id){
  const u = unlocks()[id];
  if(!u) return {open:false};
  if(u.until === -1) return {open:true, forever:true};
  const left = u.until - Date.now();
  return left > 0 ? {open:true, until:u.until, days:Math.ceil(left/DAY)} : {open:false, expired:true};
}
function setUnlock(id, months){
  const all = unlocks();
  if(months === null){ delete all[id]; }
  else if(months === 0){ all[id] = {until:-1}; }
  else { const d = new Date(); d.setMonth(d.getMonth() + months); all[id] = {until:d.getTime()}; }
  store.set('bs_wb_unlocks', all);
}
const studentName = () => store.get('bs_wb_student', '');
async function checkPass(p){
  if(!crypto.subtle) return false;
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p.trim()));
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,'0')).join('') === TEACHER_HASH;
}
const fmtDate = t => new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- toast & sheet ---------- */
let toastT;
function toast(msg, ms=3200){
  const t = $('#toast'); t.innerHTML = '<span>'+esc(msg)+'</span>'; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms);
}
function openSheet(html){ $('#sheet').innerHTML = html; $('#scrim').hidden = false; return $('#sheet'); }
function closeSheet(){ $('#scrim').hidden = true; $('#sheet').innerHTML = ''; }
$('#scrim').addEventListener('click', e => { if(e.target.id === 'scrim') closeSheet(); });

/* ======================= LIBRARY ======================= */
const LOCK_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function renderLibrary(){
  $('#shelf').innerHTML = BOOKS.map(b => {
    const u = unlockInfo(b.id);
    let chip;
    if(!b.ready) chip = '<span class="chip">Coming soon</span>';
    else if(u.forever) chip = '<span class="chip open">Unlocked</span>';
    else if(u.open && u.days <= 7) chip = `<span class="chip warn">Locks in ${u.days} day${u.days>1?'s':''}</span>`;
    else if(u.open) chip = `<span class="chip open">Open until ${fmtDate(u.until)}</span>`;
    else if(u.expired) chip = '<span class="chip">Time is up. Locked again</span>';
    else chip = '<span class="chip">Locked</span>';
    return `<button class="book ${b.ready?'':'soon'}" data-id="${b.id}" ${b.ready?'':'aria-disabled="true"'}>
      <div class="cover" style="--c:${C['g'+b.grade]}">

  }).join('');
  const n = studentName();

}
$('#shelf').addEventListener('click', e => {

function durChips(sel){

function wireDurs(sh){
  sh.querySelectorAll('.dur').forEach(d => d.onclick = () => { sh.querySelectorAll('.dur').forEach(x => x.classList.remove('on')); d.classList.add('on'); });

}
function unlockSheet(b){

}

/* ---------- teacher panel ---------- */
$('#teacherBtn').onclick = () => {

/* ---------- student name (asked once) ---------- */

/* ======================= READER ======================= */
const R = { book:null, page:1, tool:'move', colors:{pen:'#1F4E9C', marker:'#FFD60A', text:'#1F4E9C'}, size:{pen:1, marker:1}, zoom:1, data:null, undo:{}, W:0, H:0, img:null };
const ZOOMS = [1, 1.5, 2, 3];
const cache = new Map();
const bg = $('#bg'), ink = $('#ink'), live = $('#live'), texts = $('#texts'), wrap = $('#pagewrap'), stage = $('#stage');

function openBook(b){
  if(!studentName()){ askName(() => openBook(b)); return; }
  R.book = b;
  R.data = store.get('bs_wb_ans_' + b.id, {v:1, last:1, pages:{}});
  R.undo = {};
  $('#library').hidden = true; $('#reader').hidden = false;
  setTool('move'); R.zoom = 1; $('#zLbl').textContent = '1×';
  goTo(R.data.last || 1, 0);
  const u = unlockInfo(b.id);
  if(u.open && !u.forever && u.days <= 7) toast(`This workbook locks in ${u.days} day${u.days>1?'s':''}. See Mr. Hernández to keep it open.`, 5000);
  else if(!store.get('bs_wb_tip', false)){ toast('Tap Pencil to write on the page. Tap Move to scroll and zoom.', 5000); store.set('bs_wb_tip', true); }
}
$('#toLib').onclick = () => { flushSave(); $('#reader').hidden = true; $('#library').hidden = false; renderLibrary(); };

const pageData = (n = R.page) => (R.data.pages[n] ||= {s:[], t:[]});
const isEmpty = n => { const p = R.data.pages[n]; return !p || (!p.s.length && !p.t.length); };
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(flushSave, 400); }
function flushSave(){
  clearTimeout(saveT); if(!R.book) return;
  for(const k in R.data.pages) if(isEmpty(k)) delete R.data.pages[k];
  store.set('bs_wb_ans_' + R.book.id, R.data);
}
function snapshot(){ (R.undo[R.page] ||= []).push(JSON.stringify(pageData())); if(R.undo[R.page].length > 40) R.undo[R.page].shift(); updUndo(); }
function updUndo(){ $('#undo').disabled = !(R.undo[R.page] && R.undo[R.page].length); $('#clear').disabled = isEmpty(R.page); }

/* ---------- loading page images (decoded in memory, never as a file) ---------- */
async function loadPage(n){
  const k = R.book.id + n;
  if(cache.has(k)) return cache.get(k);
  const p = (async () => {
    const r = await fetch(`books/${R.book.id}/${String(n).padStart(2,'0')}.dat`);
    if(!r.ok) throw new Error('http ' + r.status);
    const a = new Uint8Array(await r.arrayBuffer());
    for(let i = 0; i < a.length; i++) a[i] ^= KEY[i % KEY.length];
    return await createImageBitmap(new Blob([a], {type:'image/webp'}));
  })();
  cache.set(k, p);
  p.catch(() => cache.delete(k));
  if(cache.size > 6){ const first = cache.keys().next().value; if(first !== k) cache.delete(first); }
  return p;
}

const pageLabel = n => n === 0 ? '©' : `${n} / ${R.book.pages - 1}`;
async function goTo(n, dir){
  n = Math.max(0, Math.min(R.book.pages - 1, n));
  if(n !== R.page) flushSave();
  R.page = n; R.data.last = n; save();
  $('#pageLbl').textContent = pageLabel(n);
  $('#prev').disabled = n === 0; $('#next').disabled = n === R.book.pages - 1;
  updUndo();
  if(dir){ wrap.classList.remove('slide-l','slide-r'); void wrap.offsetWidth; wrap.classList.add(dir > 0 ? 'slide-l' : 'slide-r'); }
  stage.scrollTo(0, 0);
  R.img = null; layout(); showStatus('Loading page…');
  try{
    const img = await loadPage(n);
    if(R.page !== n) return;
    R.img = img; showStatus(null); drawBg();
    if(n + 1 < R.book.pages) loadPage(n + 1).catch(()=>{});
    if(n - 1 >= 0) loadPage(n - 1).catch(()=>{});
  }catch(e){
    if(R.page === n) showStatus('This page did not load. Check your internet connection, then <button id="retry">try again</button>.');
    const b = $('#retry'); if(b) b.onclick = () => goTo(n, 0);
  }
}
function showStatus(html){ const s = $('#status'); if(!html){ s.hidden = true; return; } s.innerHTML = html; s.hidden = false; }
$('#prev').onclick = () => goTo(R.page - 1, -1);
$('#next').onclick = () => goTo(R.page + 1, 1);

/* ---------- layout & drawing ---------- */
function layout(){
  const avail = Math.min(stage.clientWidth - 16, 860);
  const W = Math.round(avail * R.zoom), H = Math.round(W * PAGE_RATIO);
  R.W = W; R.H = H;
  wrap.style.width = W + 'px'; wrap.style.height = H + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2600 / W, 3);
  for(const c of [bg, ink, live]){ c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); c.getContext('2d').setTransform(dpr,0,0,dpr,0,0); }
  drawBg(); drawInk(); renderTexts();
}
function drawBg(){
  const g = bg.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, R.W, R.H);
  if(!R.img) return;
  g.drawImage(R.img, 0, 0, R.W, R.H);
  // light watermark with the student's name
  const name = studentName();
  g.save();
  g.globalAlpha = .07; g.fillStyle = '#1D2B3A';
  g.font = `700 ${Math.round(R.W * .055)}px ${getComputedStyle(document.body).fontFamily}`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.translate(R.W / 2, R.H / 2); g.rotate(-Math.atan(R.H / R.W) * .55);
  g.fillText(name + ' · Basic Spanish', 0, 0);
  g.restore();
  g.save(); g.globalAlpha = .45; g.fillStyle = '#5D6B78';
  g.font = `${Math.max(9, Math.round(R.W * .016))}px ${getComputedStyle(document.body).fontFamily}`;
  g.textAlign = 'left'; g.fillText('Licensed to ' + name, R.W * .025, R.H * .985);
  g.restore();
}
function strokePath(g, s, W, H){
  const p = s.p;
  g.save();
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = g.fillStyle = s.c; g.lineWidth = Math.max(1, s.w * W);
  if(s.k === 'm'){ g.globalAlpha = .38; g.globalCompositeOperation = 'multiply'; }
  if(p.length <= 2){ g.beginPath(); g.arc(p[0]/1e4*W, p[1]/1e4*H, g.lineWidth/2, 0, 7); g.fill(); g.restore(); return; }
  g.beginPath(); g.moveTo(p[0]/1e4*W, p[1]/1e4*H);
  for(let i = 2; i < p.length - 2; i += 2){
    const x = p[i]/1e4*W, y = p[i+1]/1e4*H, nx = p[i+2]/1e4*W, ny = p[i+3]/1e4*H;
    g.quadraticCurveTo(x, y, (x+nx)/2, (y+ny)/2);
  }
  g.lineTo(p[p.length-2]/1e4*W, p[p.length-1]/1e4*H);
  g.stroke(); g.restore();
}
function drawInk(){
  const g = ink.getContext('2d'); g.clearRect(0, 0, R.W, R.H);
  if(!R.book) return;
  for(const s of pageData().s) strokePath(g, s, R.W, R.H);
}

/* ---------- pointer input on the page ---------- */
let cur = null, activeId = null;
function ptr(e){ const r = live.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 1e4), Math.round((e.clientY - r.top) / r.height * 1e4)]; }
live.addEventListener('pointerdown', e => {
  if(R.tool === 'move' || R.tool === 'text') return;
  if(activeId !== null){ cancelStroke(); return; }        // a second finger: stop drawing
  activeId = e.pointerId; live.setPointerCapture(e.pointerId);
  snapshot();
  if(R.tool === 'eraser'){ cur = {erase:true, hit:false}; eraseAt(ptr(e)); return; }
  const k = R.tool === 'marker' ? 'm' : 'p';
  cur = {k, c:R.colors[R.tool], w:SIZES[R.tool === 'marker' ? 'marker' : 'pen'][R.size[R.tool]], p:ptr(e)};
  drawLive();
});
live.addEventListener('pointermove', e => {
  if(e.pointerId !== activeId || !cur) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  if(cur.erase){ for(const ev of evs) eraseAt(ptr(ev)); return; }
  for(const ev of evs){
    const [x, y] = ptr(ev), p = cur.p;
    if(Math.abs(x - p[p.length-2]) + Math.abs(y - p[p.length-1]) > 12) p.push(x, y);
  }
  drawLive();
});
const endStroke = e => {
  if(e.pointerId !== activeId) return;
  activeId = null;
  if(!cur) return;
  if(cur.erase){ if(!cur.hit) R.undo[R.page].pop(); }
  else pageData().s.push(cur);
  cur = null;
  live.getContext('2d').clearRect(0, 0, R.W, R.H);
  drawInk(); save(); updUndo();
};
live.addEventListener('pointerup', endStroke);
live.addEventListener('pointercancel', endStroke);
function cancelStroke(){ if(cur && !cur.erase) R.undo[R.page].pop(); cur = null; activeId = null; live.getContext('2d').clearRect(0,0,R.W,R.H); updUndo(); }
function drawLive(){ const g = live.getContext('2d'); g.clearRect(0, 0, R.W, R.H); strokePath(g, cur, R.W, R.H); }
function eraseAt([x, y]){
  const pd = pageData(), r = 220, r2 = r * r * 1;                 // ~2% of the page
  const before = pd.s.length;
  pd.s = pd.s.filter(s => {
    const rr = r + s.w * 1e4 / 2;
    for(let i = 0; i < s.p.length; i += 2){ const dx = s.p[i] - x, dy = (s.p[i+1] - y) * PAGE_RATIO; if(dx*dx + dy*dy < rr*rr) return false; }
    return true;
  });
  if(pd.s.length !== before){ cur.hit = true; drawInk(); }
}

/* ---------- typed text boxes ---------- */
function renderTexts(){
  texts.innerHTML = '';
  if(!R.book) return;
  pageData().t.forEach((t, i) => texts.appendChild(textEl(t, i)));
}
function textEl(t, i){
  const d = document.createElement('div');
  d.className = 'tb'; d.dataset.i = i;
  d.style.left = (t.x / 100) + '%'; d.style.top = (t.y / 100) + '%';
  d.innerHTML = '<span class="grip" aria-label="Move text">✥</span><div class="tx" spellcheck="false"></div><button class="del" aria-label="Delete text">×</button>';
  const tx = d.querySelector('.tx');
  tx.textContent = t.s; tx.style.color = t.c; tx.style.fontSize = (R.W * .032) + 'px';
  try{ tx.contentEditable = 'plaintext-only'; }catch(e){ tx.contentEditable = 'true'; }
  if(tx.contentEditable !== 'plaintext-only') tx.contentEditable = 'true';
  let startVal = t.s;
  tx.addEventListener('focus', () => { d.classList.add('focus'); startVal = tx.textContent; });
  tx.addEventListener('input', () => { t.s = tx.textContent; save(); });
  tx.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); tx.blur(); } });
  tx.addEventListener('blur', () => setTimeout(() => {
    d.classList.remove('focus');
    if(!t.s.trim()){ const pd = pageData(); const k = pd.t.indexOf(t); if(k > -1){ pd.t.splice(k, 1); renderTexts(); } }
    else if(t.s !== startVal){ /* undo snapshot taken on create/first edit */ }
    save(); updUndo();
  }, 150));
  d.querySelector('.del').addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); snapshot();
    const pd = pageData(); pd.t.splice(pd.t.indexOf(t), 1); renderTexts(); save(); updUndo();
  });
  const grip = d.querySelector('.grip');
  grip.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); snapshot();
    grip.setPointerCapture(e.pointerId);
    const move = ev => {
      const r = texts.getBoundingClientRect();
      t.x = Math.max(0, Math.min(9500, Math.round((ev.clientX - r.left + 14) / r.width * 1e4)));
      t.y = Math.max(0, Math.min(1e4, Math.round((ev.clientY - r.top) / r.height * 1e4)));
      d.style.left = (t.x / 100) + '%'; d.style.top = (t.y / 100) + '%';
    };
    const up = () => { grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); save(); tx.focus(); };
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up);
  });
  return d;
}
texts.addEventListener('pointerup', e => {
  if(R.tool !== 'text' || e.target !== texts) return;
  if(document.activeElement && document.activeElement.classList.contains('tx')){ document.activeElement.blur(); return; }
  const r = texts.getBoundingClientRect();
  snapshot();
  const t = {x:Math.round((e.clientX - r.left) / r.width * 1e4), y:Math.round((e.clientY - r.top) / r.height * 1e4), s:'', c:R.colors.text};
  pageData().t.push(t);
  const el = textEl(t, pageData().t.length - 1);
  texts.appendChild(el);
  setTimeout(() => el.querySelector('.tx').focus(), 30);
});

/* ---------- tools ---------- */
function setTool(t){
  R.tool = t;
  document.querySelectorAll('.tool[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  const rd = $('#reader');
  rd.classList.toggle('move', t === 'move'); rd.classList.toggle('textmode', t === 'text');
  if(t !== 'text' && document.activeElement && document.activeElement.classList.contains('tx')) document.activeElement.blur();
  renderPalette();
}
document.querySelectorAll('.tool[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
function renderPalette(){
  const pal = $('#palette');
  const show = ['pen','marker','text'].includes(R.tool);
  pal.hidden = !show; if(!show) return;
  const cols = PALETTE.filter(([c]) => !(R.tool === 'text' && c === '#FFFFFF'));
  let h = cols.map(([c, n]) => `<button class="sw ${c === R.colors[R.tool] ? 'on' : ''}" style="--c:${c}" data-c="${c}" aria-label="${n}" title="${n}"></button>`).join('');
  if(R.tool !== 'text'){
    const dots = R.tool === 'marker' ? [8, 13, 19] : [4, 7, 11];
    h += '<span class="sizes">' + dots.map((d, i) => `<button class="sz ${R.size[R.tool] === i ? 'on' : ''}" data-s="${i}" aria-label="Size ${i+1}"><i style="width:${d}px;height:${d}px"></i></button>`).join('') + '</span>';
  }
  pal.innerHTML = h;
  pal.querySelectorAll('.sw').forEach(b => b.onclick = () => {
    R.colors[R.tool] = b.dataset.c; renderPalette();
    const a = document.activeElement;
    if(R.tool === 'text' && a && a.classList.contains('tx')){ const t = pageData().t[+a.parentNode.dataset.i]; if(t){ t.c = R.colors.text; a.style.color = t.c; save(); } }
  });
  pal.querySelectorAll('.sz').forEach(b => b.onclick = () => { R.size[R.tool] = +b.dataset.s; renderPalette(); });
}
$('#undo').onclick = () => {
  const st = R.undo[R.page]; if(!st || !st.length) return;
  R.data.pages[R.page] = JSON.parse(st.pop());
  drawInk(); renderTexts(); save(); updUndo();
};
$('#clear').onclick = () => {
  const sh = openSheet(`<h2>Clear this page?</h2><p>Everything you wrote on page ${R.page} will be removed. You can still tap Undo afterwards.</p>
    <button class="btn danger" id="go">Clear page</button><button class="btn ghost" id="cancel">Keep my work</button>`);
  sh.querySelector('#cancel').onclick = closeSheet;
  sh.querySelector('#go').onclick = () => { snapshot(); R.data.pages[R.page] = {s:[], t:[]}; drawInk(); renderTexts(); save(); updUndo(); closeSheet(); };
};

/* ---------- zoom ---------- */
function setZoom(z){
  const cx = (stage.scrollLeft + stage.clientWidth / 2) / (wrap.offsetWidth || 1);
  const cy = (stage.scrollTop + stage.clientHeight / 2) / (wrap.offsetHeight || 1);
  R.zoom = z; layout();
  stage.scrollLeft = cx * wrap.offsetWidth - stage.clientWidth / 2;
  stage.scrollTop = cy * wrap.offsetHeight - stage.clientHeight / 2;
  $('#zLbl').textContent = z + '×';
}
$('#zoom').onclick = () => { const z = ZOOMS[(ZOOMS.indexOf(R.zoom) + 1) % ZOOMS.length]; setZoom(z); if(z > 1 && R.tool !== 'move') toast('Tap Move to slide around the page.'); };

/* ---------- swipe to turn pages (Move tool, normal size) ---------- */
let sw0 = null;
stage.addEventListener('touchstart', e => { sw0 = (R.tool === 'move' && R.zoom === 1 && e.touches.length === 1) ? [e.touches[0].clientX, e.touches[0].clientY, Date.now()] : null; }, {passive:true});
stage.addEventListener('touchend', e => {
  if(!sw0) return;
  const t = e.changedTouches[0], dx = t.clientX - sw0[0], dy = t.clientY - sw0[1];
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - sw0[2] < 600) goTo(R.page + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
  sw0 = null;
}, {passive:true});

/* ---------- contents sheet ---------- */
$('#pageBtn').onclick = () => {
  const b = R.book;
  const toc = b.toc.map(x => x.unit ? `<li class="unit">${esc(x.unit)}</li>` : `<li><button data-p="${x.p}"><span class="t">${esc(x.t)}</span><span class="pg">${x.p}</span></button></li>`).join('');
  let grid = '';
  for(let n = 1; n < b.pages; n++) grid += `<button data-p="${n}" class="${n === R.page ? 'cur' : ''} ${isEmpty(n) ? '' : 'done'}" aria-label="Page ${n}">${n}</button>`;
  const sh = openSheet(`<h2>Grade ${b.grade}, Term ${b.term}</h2><ul class="toc">${toc}</ul>
    <div class="lbl">All pages <span style="font-weight:400;color:var(--muted)">(a blue dot means you wrote on it)</span></div><div class="pgrid">${grid}</div>
    <button class="btn ghost" id="copy" style="margin-top:14px">Copyright page</button>`);
  sh.querySelectorAll('[data-p]').forEach(x => x.onclick = () => { closeSheet(); const p = +x.dataset.p; goTo(p, p > R.page ? 1 : -1); });
  sh.querySelector('#copy').onclick = () => { closeSheet(); goTo(0, -1); };
};

/* ---------- keyboard, resize, protection ---------- */
document.addEventListener('keydown', e => {
  const typing = document.activeElement && (document.activeElement.classList.contains('tx') || document.activeElement.tagName === 'INPUT');
  if((e.ctrlKey || e.metaKey) && ['p','s'].includes(e.key.toLowerCase())){ e.preventDefault(); return; }
  if($('#reader').hidden || typing || !$('#scrim').hidden) return;
  if(e.key === 'ArrowRight') goTo(R.page + 1, 1);
  if(e.key === 'ArrowLeft') goTo(R.page - 1, -1);
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); $('#undo').click(); }
});
document.addEventListener('contextmenu', e => { if(!e.target.closest('input,.tx')) e.preventDefault(); });
document.addEventListener('dragstart', e => e.preventDefault());
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if(!$('#reader').hidden) layout(); }, 150); });
document.addEventListener('visibilitychange', () => { if(document.hidden) flushSave(); });
window.addEventListener('pagehide', flushSave);

renderLibrary();
</script>
</body>
</html>

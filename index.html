<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E6E78">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Basic Spanish · Alberto Garrido Hernández</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF6F4; --surface:#FFFFFF; --ink:#12343B; --muted:#4F6D72;
  --teal:#0E6E78; --teal-soft:#D5EEEB; --mango:#FFB627; --hibiscus:#E0405A; --lime:#4E9A2A;
  --line:#CFE5E2; --shadow:0 4px 0 #BFDCD8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D2226; --surface:#15333A; --ink:#EAF6F4; --muted:#A6C3C6;
    --teal:#4FC3CE; --teal-soft:#1C434A; --mango:#FFC247; --hibiscus:#FF6B81; --lime:#7CC952;
    --line:#24484F; --shadow:0 4px 0 #081518;
  }
}
:root[data-theme="dark"]{
  --bg:#0D2226; --surface:#15333A; --ink:#EAF6F4; --muted:#A6C3C6;
  --teal:#4FC3CE; --teal-soft:#1C434A; --mango:#FFC247; --hibiscus:#FF6B81; --lime:#7CC952;
  --line:#24484F; --shadow:0 4px 0 #081518;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:1.05rem;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--mango);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:.6rem 1rem 3rem}
.f{font-family:"Fredoka","Trebuchet MS",sans-serif}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin:0 0 .6rem}
.stars{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.15rem;background:var(--mango);color:#3A2600;padding:.3rem .8rem;border-radius:999px;white-space:nowrap}
.back{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.35rem .8rem;font-family:"Fredoka",sans-serif;font-weight:600}

/* Home */
.hero{margin:0 0 1.5rem}
.owner{color:var(--muted);font-size:.95rem;line-height:1.3}
.owner .role{font-size:.78rem}
.hero small{color:var(--muted);display:block}
.hero h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(3.4rem,15vw,5.2rem);line-height:.95;margin:0 0 .5rem;color:var(--teal)}
.hero p{margin:0;color:var(--muted);max-width:52ch}
h2.sec{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.3rem;margin:1.75rem 0 .75rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem}
.unit{position:relative;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:.8rem .8rem .7rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.15rem;min-height:132px}
.unit:active{transform:translateY(3px);box-shadow:none}
.unit .num{font-family:"Fredoka",sans-serif;color:var(--muted);font-size:.85rem}
.unit .ic{font-size:2rem;line-height:1.2}
.unit .es{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;line-height:1.15}
.unit .en{color:var(--muted);font-size:.85rem;line-height:1.2}
.unit .got{position:absolute;top:.6rem;right:.7rem;font-size:.85rem;letter-spacing:-.1em}

/* Unit header */
.uhead{display:flex;gap:.8rem;align-items:center;margin-bottom:1rem}
.uhead .ic{font-size:2.8rem;line-height:1}
.uhead h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.05;margin:0;color:var(--teal)}
.uhead p{margin:.1rem 0 0;color:var(--muted)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.3rem;margin-bottom:1rem}
.tabs button{min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:.4rem .15rem;font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(.78rem,3.4vw,1rem)}
.tabs button[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.tabs button small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;font-size:.72rem;opacity:.8;line-height:1}
.tabs button{line-height:1.15}
.chips button small{opacity:.7;font-size:.82rem}
.bi .es2{display:block}
.bi .en2{display:block;font-size:.9em;opacity:.8;font-style:italic}
.hero .bi{margin:0;color:var(--muted);max-width:52ch}
.hint{color:var(--muted);margin:0 0 1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.chips button{background:transparent;border:2px solid var(--line);border-radius:10px;padding:.25rem .7rem;font-size:.95rem}
.chips button[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--ink);font-weight:700}

/* Flashcard */
.stage{perspective:1200px;max-width:360px;margin:0 auto}
.card{position:relative;width:100%;aspect-ratio:4/4.4;border:none;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;background:var(--surface);border:3px solid var(--line);box-shadow:var(--shadow);padding:1rem;text-align:center}
.face .big{font-size:clamp(5rem,26vw,7.5rem);line-height:1.1}
.face .txt{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(1.6rem,7vw,2.2rem);line-height:1.15}
.face .tap{color:var(--muted);font-size:.95rem}
.face.back2{transform:rotateY(180deg);background:var(--teal);border-color:var(--teal);color:#fff}
.face.back2 .word{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.8rem,9vw,2.8rem);line-height:1.1}
.face.back2 .sub{color:#DDF3F1}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
.btn{border-radius:14px;padding:.6rem 1rem;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.primary{background:var(--mango);border-color:var(--mango);color:#3A2600}
.btn:disabled{opacity:.45;cursor:default}
.counter{font-family:"Fredoka",sans-serif;color:var(--muted);min-width:4.5ch;text-align:center}

/* Phrases */
.pat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:.9rem 1rem;margin-bottom:.7rem}
.row{display:flex;gap:.6rem;align-items:flex-start}
.row + .row{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed var(--line)}
.say{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--bg);font-size:1.05rem;display:grid;place-items:center}
.row .es{font-weight:700;font-size:1.1rem}
.row .en{color:var(--muted);font-size:.95rem}
.lab{font-family:"Fredoka",sans-serif;font-size:.8rem;color:var(--teal);font-weight:600}

/* Dialogue */
.chat{display:flex;flex-direction:column;gap:.5rem}
.bub{max-width:85%;border:none;text-align:left;padding:.6rem .9rem;border-radius:18px;background:var(--surface);border:2px solid var(--line)}
.bub .who{display:block;font-family:"Fredoka",sans-serif;font-size:.8rem;color:var(--teal);font-weight:600}
.bub.r{align-self:flex-end;background:var(--teal-soft);border-color:var(--teal-soft)}
.bub.on{outline:3px solid var(--mango)}

/* Match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.col{display:grid;gap:.6rem;align-content:start}
.tile{min-height:60px;border-radius:16px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;padding:.4rem;line-height:1.15}
.tile.pic{font-size:2rem}
.tile.sel{border-color:var(--mango);background:color-mix(in srgb,var(--mango) 20%,var(--surface))}
.tile.done{background:var(--lime);border-color:var(--lime);color:#fff;box-shadow:none;opacity:.55;cursor:default}
.tile.wrong{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.tile.wrong{animation:none;border-color:var(--hibiscus)}}

/* Quiz */
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:1rem}
.progress div{height:100%;background:var(--teal);width:0;transition:width .3s}
.qbox{background:var(--surface);border:3px solid var(--line);border-radius:24px;padding:1.2rem;text-align:center;box-shadow:var(--shadow)}
.qp{color:var(--muted);margin:0 0 .3rem}
.qbox .say{margin:0 auto}
.qbig{font-size:5rem;line-height:1.2}
.qtxt{font-family:"Fredoka",sans-serif;font-size:clamp(1.5rem,6vw,2rem);font-weight:600;margin:.4rem 0;line-height:1.2}
.qlisten{font-size:3rem;width:96px;height:96px;border-radius:50%;border:3px solid var(--mango);background:var(--bg);margin:.4rem auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1rem}
.opts.long{grid-template-columns:1fr}
.opt{border-radius:14px;padding:.75rem .5rem;background:var(--bg);border:2px solid var(--line);font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;line-height:1.2}
.opt.right{background:var(--lime);border-color:var(--lime);color:#fff}
.opt.bad{background:var(--hibiscus);border-color:var(--hibiscus);color:#fff}
.fb{min-height:1.6em;margin:.9rem 0 0;font-weight:700}
.rules{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:.7rem .9rem;margin-bottom:.8rem;text-align:center}
.rules .rt{font-family:"Fredoka",sans-serif;font-weight:600;color:var(--teal)}
.rules .rr{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem 1rem;margin:.3rem 0;font-weight:700}
.rules .rb{color:var(--muted);font-size:.92rem}
.live{display:flex;justify-content:space-between;font-family:"Fredoka",sans-serif;font-weight:600;color:var(--muted);margin-bottom:.35rem}
.won{font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.3rem;color:var(--lime)}
.stars.pop{animation:pop .6s ease}
@keyframes pop{40%{transform:scale(1.35)}}
@media (prefers-reduced-motion: reduce){.stars.pop{animation:none}}
.line{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:.4rem;display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;align-items:center;margin:.6rem 0}
.bank{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center}
.w{border-radius:10px;padding:.4rem .7rem;background:var(--teal-soft);border:2px solid var(--teal-soft);font-weight:700}
.w.used{visibility:hidden}
.result .big{font-family:"Fredoka",sans-serif;font-size:2.6rem;font-weight:700;color:var(--teal);margin:.2rem 0}
.result .st{font-size:2.2rem;letter-spacing:.1em}

/* Books */
.promo{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;background:var(--mango);color:#3A2600;border:none;border-radius:18px;padding:.8rem 1rem;box-shadow:0 4px 0 #D9920A;margin-top:1.2rem}
.promo .pi{font-size:2rem}
.promo b{font-family:"Fredoka",sans-serif;font-size:1.1rem;display:block}
.bookintro{display:grid;grid-template-columns:1.6rem 1fr;row-gap:.35rem;margin:0 0 1rem}
.bookintro .hint{grid-column:2;margin:0}
.bookintro .pin{grid-column:1}
.bookintro .buy{grid-column:2;font-weight:700;color:var(--teal)}
.apkbtn{display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;background:linear-gradient(#5BEA9C,#2FC873);color:#0B3B22;border-radius:999px;padding:.4rem .95rem;font-family:"Fredoka",sans-serif;font-weight:600;font-size:.95rem;margin:.1rem 0 .9rem;border:1px solid #23A95E;box-shadow:0 4px 0 #1C8A4C,0 6px 10px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .08s,box-shadow .08s}
.apkbtn:hover{filter:brightness(1.05)}
.apkbtn:active{transform:translateY(4px);box-shadow:0 0 0 #1C8A4C,0 2px 4px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.6)}
.grade{font-family:"Fredoka",sans-serif;font-weight:600;color:var(--teal);margin:1.2rem 0 .5rem}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
.book{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:.6rem;box-shadow:var(--shadow);scroll-margin-top:1rem}
.book.flash{outline:3px solid var(--mango)}
.book img{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:contain;background:#fff;border-radius:8px}
.book h3{font-family:"Fredoka",sans-serif;font-size:1rem;margin:.5rem 0 .1rem;line-height:1.2}
.book summary{cursor:pointer;color:var(--teal);font-weight:700;font-size:.9rem;margin-top:.2rem}
.book ul{margin:.4rem 0 0;padding-left:1.1rem;font-size:.88rem;color:var(--muted)}
.ubooks{margin-top:2rem;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:1rem}
.uhd{display:flex;gap:.55rem;align-items:flex-start}
.uic{font-size:1.3rem;line-height:1.3}
.ubooks h2{font-family:"Fredoka",sans-serif;font-size:1.15rem;margin:0 0 .2rem}
.ubooks p{margin:0 0 .8rem;color:var(--muted);font-size:.92rem}
.thumbs{display:flex;gap:.7rem;overflow-x:auto;padding-bottom:.3rem}
.thumb{flex:0 0 96px;background:none;border:none;padding:0;text-align:center;font-size:.8rem;font-weight:700}
.thumb .tl{display:block;white-space:nowrap}
.thumb img{width:96px;height:128px;object-fit:contain;background:#fff;border:2px solid var(--line);border-radius:8px;display:block;margin-bottom:.25rem}
footer{margin-top:2.5rem;color:var(--muted);font-size:.85rem;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- Number words ---------- */
const N0=["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"];
const NT={30:"treinta",40:"cuarenta",50:"cincuenta",60:"sesenta",70:"setenta",80:"ochenta",90:"noventa"};
function nw(n){ if(n<30) return N0[n]; if(n===100) return "cien"; const t=Math.floor(n/10)*10, u=n%10; return NT[t]+(u?" y "+N0[u]:""); }
const NUMS=[];
for(let n=1;n<=31;n++) NUMS.push(nw(n)+"|"+n+"|"+n);
[40,50,60,70,80,90,100].forEach(n=>NUMS.push(nw(n)+"|"+n+"|"+n));
[["ciento uno",101],["doscientos",200],["trescientos",300],["cuatrocientos",400],["quinientos",500],["seiscientos",600],["setecientos",700],["ochocientos",800],["novecientos",900],["mil",1000]].forEach(([w,n])=>NUMS.push(w+"|"+n+"|"+n));

const ALPHA="A:a B:be C:ce D:de E:e F:efe G:ge H:hache I:i J:jota K:ka L:ele M:eme N:ene Ñ:eñe O:o P:pe Q:cu R:ere S:ese T:te U:u V:uve W:doble ve X:equis Y:i griega Z:zeta".split(" ").reduce((a,x,i,arr)=>a,[]);
const ALPHA_LIST=[["A","a"],["B","be"],["C","ce"],["D","de"],["E","e"],["F","efe"],["G","ge"],["H","hache"],["I","i"],["J","jota"],["K","ka"],["L","ele"],["M","eme"],["N","ene"],["Ñ","eñe"],["O","o"],["P","pe"],["Q","cu"],["R","ere"],["S","ese"],["T","te"],["U","u"],["V","uve"],["W","doble ve"],["X","equis"],["Y","i griega"],["Z","zeta"]].map(([l,n])=>n+"|the letter "+l+"|"+l);

/* ---------- Grammar tables ---------- */
const P_ES=["yo","tú","él / ella / usted","nosotros","vosotros","ellos / ellas / ustedes"];
const P_EN=["I","you","he / she","we","you all","they"];
function conj(forms, en){ return forms.map((f,i)=>P_ES[i].split(" / ")[0]+" "+f+"|"+P_EN[i]+" "+en[i]); }
const pres=(b,s)=>[b,b,s||b+"s",b,b,b];
const same=w=>[w,w,w,w,w,w];

/* ---------- Book content ---------- */
const U=[
{i:"👋",t:"Presentarse uno mismo",e:"Introducing oneself",
 v:{"Saludos":["hola|hello / hi|👋","buenos días|good morning|🌅","buenas tardes|good afternoon|☀️","buenas noches|good evening|🌙","¿cómo estás?|how are you doing?","bien, gracias|fine, thanks|🙂","¿y tú?|how about you?","estoy más o menos|I am so-so|😐","me siento mal|I am not doing well|🤒"],
    "Despedidas":["adiós|goodbye","hasta la vista|see you","hasta luego|see you later","chao|bye"],
    "Pronombres":["yo|I","tú|you (singular, less formal)","usted|you (singular, formal)","él|he","ella|she","nosotros / nosotras|we","ellos / ellas|they","ustedes|you (plural, formal)","vosotros / vosotras|you (plural, less formal)"],
    "Números":NUMS,
    "Yo soy…":["un niño|a boy|👦","una niña|a girl|👧"]},
 p:["¿Cómo te llamas?|What is your name?|Me llamo Eduardo.|I am Eduardo.","¿Qué edad tú tienes?|How old are you?|Yo tengo nueve años.|I am nine years old.","¿Cómo estás?|How are you doing?|Bien, gracias. ¿Y tú?|Fine, thanks. How about you?","||Hola. Me llamo Carlos. Yo soy un niño. Yo tengo siete años.|Hello. I am Carlos. I am a boy. I am seven years old.","||Buenos días. Me llamo Claudia. Yo soy una niña. Yo tengo seis años.|Good morning. I am Claudia. I am a girl. I am six years old.","||Tú eres muy inteligente.|You are very intelligent.","||Ella es mi hermana.|She is my sister."],
 d:["Roberto|Buenos días.","Silvia|Buenos días.","Roberto|¿Cómo estás?","Silvia|Bien, gracias. ¿Y tú?","Roberto|Yo estoy bien, gracias. Adiós.","Silvia|Adiós."],
 s:["Me llamo Carlos","Yo tengo siete años","Yo soy una niña","Buenas tardes cómo estás"]},

{i:"📅",t:"Decir día, mes y año",e:"Saying day, month, and year",
 v:{"Días de la semana":["domingo|Sunday","lunes|Monday","martes|Tuesday","miércoles|Wednesday","jueves|Thursday","viernes|Friday","sábado|Saturday"],
    "Meses del año":["enero|January","febrero|February","marzo|March","abril|April","mayo|May","junio|June","julio|July","agosto|August","septiembre|September","octubre|October","noviembre|November","diciembre|December"]},
 p:["||Hoy es sábado, 5 de abril de 2025.|Today is Saturday, April 5, 2025.","||Hoy es viernes, 7 de marzo de 2025.|Today is Friday, March 7, 2025.","||Hoy es lunes, 7 de abril de 2025.|Today is Monday, April 7, 2025."],
 d:[], s:["Hoy es sábado 5 de abril","Hoy es viernes 7 de marzo"]},

{i:"🔤",t:"Verificar la ortografía",e:"Verifying spelling",
 v:{"Alfabeto":ALPHA_LIST,"Contracciones":["al|a + el (to the)","del|de + el (of the / from the)"]},
 p:["¿Podrías deletrear tu nombre, por favor?|Could you spell your name, please?|ce, ele, a, u, de, i, a|C-L-A-U-D-I-A","¿Podrías deletrear «gracias», por favor?|Could you spell “gracias”, please?|ge, ere, a, ce, i, a, ese|G-R-A-C-I-A-S","||Mañana voy al parque.|Tomorrow I go to the park.","||Él viene del estadio.|He comes from the stadium.","||Ellos van al banco.|They go to the bank.","||La página del libro.|The page of the book."],
 d:[], s:["Ellos van al banco","Él viene del estadio","Podrías deletrear tu nombre por favor"]},

{i:"🙋",t:"Preguntar el nombre de alguien",e:"Asking for someone’s name",
 v:{"Frases":["¿cómo te llamas?|what’s your name?","me llamo…|my name is…","¿cómo se llama él?|what is his name?","¿cómo se llama ella?|what is her name?","él se llama…|his name is…","ella se llama…|her name is…"]},

function h(tag,attrs={},...kids){const el=document.createElement(tag);for(const k in attrs){if(k==="on")for(const ev in attrs.on)el.addEventListener(ev,attrs.on[ev]);else if(k==="cls")el.className=attrs[k];else el.setAttribute(k,attrs[k]);}kids.flat().forEach(c=>{if(c==null)return;el.append(c.nodeType?c:document.createTextNode(c));});return el;}
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);

function items(u){const out=[];for(const g in u.v)u.v[g].forEach(s=>{const[es,en,e]=s.split("|");out.push({es,en,e:e||"",g});});return out;}

/* Speech */
let esVoice=null;
function loadVoices(){if(!("speechSynthesis" in window))return;const vs=speechSynthesis.getVoices();esVoice=vs.find(v=>/^es(-|_)(MX|US|419)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speak(text,opts={}){
  if(!("speechSynthesis" in window))return;
  if(!opts.queue)speechSynthesis.cancel();
  const clean=text.replace(/\(.*?\)/g,"").replace(/…/g,"").replace(/ \/ /g,", ");
  const u=new SpeechSynthesisUtterance(clean);u.lang="es-ES";u.rate=opts.rate||.85;u.pitch=opts.pitch||1;
  if(esVoice)u.voice=esVoice;if(opts.end)u.onend=opts.end;
  speechSynthesis.speak(u);
}

/* Cards */
function viewCards(u,box){

  function deck(){return u.v[g].map(s=>{const[es,en,e]=s.split("|");return{es,en,e};});}
  function draw(){
    chips.innerHTML="";
    if(groups.length>1)groups.forEach(x=>chips.append(h("button",{"aria-pressed":String(x===g),on:{click:()=>{g=x;i=0;draw();}}},x,GROUP_EN[x]?h("small",{}," · "+GROUP_EN[x]):null)));
    const d=deck(),w=d[i];
    const card=h("button",{cls:"card","aria-label":"Voltear tarjeta"},
      h("div",{cls:"face"},w.e?h("div",{cls:"big"},w.e):h("div",{cls:"txt"},w.en),h("div",{cls:"tap"},w.e?w.en:"¿Cómo se dice? · How do you say it?")),
      h("div",{cls:"face back2"},h("div",{cls:"word"},w.es),h("div",{cls:"sub"},w.en)));
    card.addEventListener("click",()=>{card.classList.toggle("flipped");if(card.classList.contains("flipped"))speak(w.es);});
    stage.innerHTML="";stage.append(card);
    count.textContent=(i+1)+"/"+d.length;
  }
  box.append(bi("Toca la tarjeta para ver y escuchar la palabra.","Tap the card to see and hear the Spanish word."),chips,stage,
    h("div",{cls:"controls"},
      h("button",{cls:"btn","aria-label":"Anterior",on:{click:()=>{const n=deck().length;i=(i-1+n)%n;draw();}}},"◀"),
      h("button",{cls:"btn primary",on:{click:()=>speak(deck()[i].es)}},"🔊 Escuchar · Listen"),
      count,
      h("button",{cls:"btn","aria-label":"Siguiente",on:{click:()=>{i=(i+1)%deck().length;draw();}}},"▶")));
  draw();
}

/* Dialogue */
function viewDialogue(u,box){
  const lines=u.d.map(s=>s.split("|"));const first=lines[0][0];
  const bubs=lines.map(([who,txt])=>h("button",{cls:"bub"+(who===first?"":" r"),on:{click:()=>speak(txt,{pitch:who===first?1.15:.85})}},h("span",{cls:"who"},who),txt));
  let playing=false;
  const play=h("button",{cls:"btn primary",on:{click:()=>{
    if(playing){speechSynthesis.cancel();playing=false;bubs.forEach(b=>b.classList.remove("on"));play.textContent="▶ Escuchar · Listen";return;}
    playing=true;play.textContent="■ Parar · Stop";let k=0;
    const next=()=>{bubs.forEach(b=>b.classList.remove("on"));if(!playing||k>=lines.length){playing=false;play.textContent="▶ Escuchar · Listen";return;}
      const[who,txt]=lines[k];bubs[k].classList.add("on");k++;speak(txt,{queue:true,pitch:who===first?1.15:.85,end:()=>setTimeout(next,350)});};
    speechSynthesis.cancel();next();}}},"▶ Escuchar · Listen");
  box.append(bi("Escucha y luego practica el diálogo con un amigo. Toca una línea para oírla otra vez.","Listen, then act it out with a friend. Tap a line to hear it again."),
    h("div",{cls:"controls",style:"margin:0 0 1rem"},play),h("div",{cls:"chat"},bubs));
}

/* Match */
function viewMatch(u,box){
  const W=h("div",{cls:"col"}),P=h("div",{cls:"col"});
  const again=h("button",{cls:"btn",on:{click:start}},"Jugar otra vez · Play again");
  box.append(bi("Toca una palabra en español y luego su pareja.","Tap a Spanish word, then tap its match."),h("div",{cls:"match"},W,P),h("div",{cls:"controls"},again));
  function start(){
    const seen=new Set();const pool=shuffle(items(u)).filter(x=>{const k=x.e||x.en;if(seen.has(k))return false;seen.add(k);return true;});
    const round=pool.slice(0,6);let sel=null,done=0;W.innerHTML="";P.innerHTML="";
    shuffle(round).forEach(w=>{const b=h("button",{cls:"tile"},w.es);b.dataset.k=w.es;
      b.onclick=()=>{if(b.classList.contains("done"))return;W.querySelectorAll(".tile").forEach(t=>t.classList.remove("sel"));b.classList.add("sel");sel=b;speak(w.es);};W.append(b);});
    shuffle(round).forEach(w=>{const b=h("button",{cls:"tile"+(w.e?" pic":""),"aria-label":w.en},w.e||w.en);b.dataset.k=w.es;
      b.onclick=()=>{if(!sel||b.classList.contains("done"))return;
        if(sel.dataset.k===b.dataset.k){sel.classList.remove("sel");sel.classList.add("done");b.classList.add("done");sel=null;done++;
          if(done===round.length){setTimeout(()=>speak("¡Muy bien!"),300);}}
        else{b.classList.add("wrong");setTimeout(()=>b.classList.remove("wrong"),350);}};P.append(b);});
  }
  start();
}

/* Quiz */
function timePhrase(hh,mm){
  let hr=hh,tail;
  if(mm===0)tail="en punto";else if(mm===15)tail="y cuarto";else if(mm===30)tail="y media";
  else if(mm<30)tail="y "+nw(mm);else{hr=hh%12+1;tail="menos "+nw(60-mm);}
  return (hr===1?"Es la una":"Son las "+nw(hr))+" "+tail;
}
function makeQuiz(u){
  const pool=items(u), global=ALL.flatMap(items);
  const qs=[];
  const distract=(ans,key)=>{let c=shuffle(pool.filter(x=>x[key]!==ans[key]&&x.es!==ans.es&&x.en!==ans.en));
    if(c.length<3)c=c.concat(shuffle(global.filter(x=>x.g===ans.g?false:x[key]!==ans[key])));
    const out=[],seen=new Set([ans[key]]);for(const x of c){if(!seen.has(x[key])){seen.add(x[key]);out.push(x[key]);}if(out.length===3)break;}return out;};
  const n=10;
  for(let k=0;k<n;k++){
    if(u.special==="math"&&k%2===0){
      const add=Math.random()<.5;let a=1+Math.floor(Math.random()*40),b=1+Math.floor(Math.random()*20);if(!add&&b>a)[a,b]=[b,a];
      const r=add?a+b:a-b,op=add?"más":"menos";
      const right=`${nw(a)} ${op} ${nw(b)} es igual a ${nw(r)}`;
      const wrongs=new Set();while(wrongs.size<3){const d=1+Math.floor(Math.random()*3);const t=pick([0,1,2]);
        const aa=t===0?a+d:a,bb=t===1?b+d:b,rr=t===2?r+d:r;wrongs.add(`${nw(aa)} ${op} ${nw(bb)} es igual a ${nw(rr)}`);}
      qs.push({type:"sym",prompt:"Léelo en español · Read it in Spanish",show:`${a} ${add?"+":"−"} ${b} = ${r}`,ans:right,opts:shuffle([right,...wrongs]),long:true,say:right});continue;
    }
    if(u.special==="clock"&&k%2===0){
      const hh=1+Math.floor(Math.random()*12),mm=pick([0,15,30,0,5+Math.floor(Math.random()*20),35+Math.floor(Math.random()*20)]);
      const right=timePhrase(hh,mm);const wrongs=new Set();
      while(wrongs.size<3){const w=timePhrase(1+Math.floor(Math.random()*12),pick([0,10,15,20,30,40,45,50]));if(w!==right)wrongs.add(w);}
      qs.push({type:"sym",prompt:"¿Qué hora es? · What time is it?",show:`🕐 ${hh}:${String(mm).padStart(2,"0")}`,ans:right,opts:shuffle([right,...wrongs]),long:true,say:right});continue;
    }
    if(u.s.length&&Math.random()<.2){const sent=pick(u.s);qs.push({type:"order",sent});continue;}
    const w=pick(pool);
    const types=["en2es","es2en","listen"];if(w.e)types.push("pic","pic");
    const t=pick(types);
    if(t==="es2en"){qs.push({type:t,w,ans:w.en,opts:shuffle([w.en,...distract(w,"en")])});}
    else qs.push({type:t,w,ans:w.es,opts:shuffle([w.es,...distract(w,"es")])});
  }
  return qs;
}
function viewQuiz(u,box){
  const idx=cur;let qs=makeQuiz(u),qi=0,score=0;
  const bar=h("div",{});const area=h("div",{});
  const best=prog[idx]||0;
  const live=h("div",{cls:"live"});
  const upd=()=>{live.innerHTML="";live.append(h("span",{},"Pregunta · Question "+Math.min(qi+1,qs.length)+"/"+qs.length),h("span",{},"✔ "+score));};
  box.append(
    h("div",{cls:"rules"},
      h("div",{cls:"rt"},"Gana estrellas · Earn stars"),
      h("div",{cls:"rr"},h("span",{},"⭐⭐⭐ 9–10"),h("span",{},"⭐⭐ 7–8"),h("span",{},"⭐ 4–6")),
      h("div",{cls:"rb"},best?"Tu mejor resultado · Your best: "+"⭐".repeat(best):"Todavía no tienes estrellas aquí · No stars here yet.")),
    live,h("div",{cls:"progress"},bar),area);
  function next(){qi++;show();}
  function show(){
    bar.style.width=(qi/qs.length*100)+"%";area.innerHTML="";upd();
    if(qi>=qs.length){
      const pct=score/qs.length,st=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
      if(st>(prog[idx]||0)){prog[idx]=st;save();}
      area.append(h("div",{cls:"qbox result"},h("p",{cls:"qp"},"Tu resultado · Your score"),h("div",{cls:"big"},score+" / "+qs.length),
        h("div",{cls:"st","aria-label":st+" stars"},st?"⭐".repeat(st):"💪"),
        h("p",{},st===3?"¡Excelente! · Excellent!":st>=1?"¡Muy bien! · Well done!":"¡Sigue practicando! · Keep practising! Try the cards first."),
        h("div",{cls:"controls"},h("button",{cls:"btn primary",on:{click:()=>render()}},"Otra vez · Try again"),h("button",{cls:"btn",on:{click:()=>home()}},"Unidades | Units"))));
      if(st)setTimeout(()=>speak("¡Muy bien!"),200);
      const sc=$(".stars");sc.textContent="⭐ "+totalStars();
      if(st>best){sc.classList.remove("pop");void sc.offsetWidth;sc.classList.add("pop");
        const r=area.querySelector(".result");r.insertBefore(h("p",{cls:"won"},"¡Ganaste "+(st-best)+" "+(st-best===1?"estrella nueva":"estrellas nuevas")+"! ⭐ You won "+(st-best)+" new "+(st-best===1?"star!":"stars!")),r.querySelector(".controls"));
        box.querySelector(".rules .rb").textContent="Tu mejor resultado · Your best: "+"⭐".repeat(st);}
      else if(st&&st<=best){const r=area.querySelector(".result");r.insertBefore(h("p",{cls:"qp"},"Tu mejor resultado sigue siendo "+"⭐".repeat(best)+". ¡Inténtalo otra vez! · Your best is still "+"⭐".repeat(best)+". Try again!"),r.querySelector(".controls"));}
      return;
    }
    const q=qs[qi];
    if(q.type==="order")return showOrder(q);
    const b=h("div",{cls:"qbox"});
    if(q.type==="pic"){b.append(h("p",{cls:"qp"},"¿Qué es esto? · What is it in Spanish?"),h("div",{cls:"qbig"},q.w.e));}
    else if(q.type==="en2es"){b.append(h("p",{cls:"qp"},"¿Cómo se dice en español? · How do you say it in Spanish?"),h("div",{cls:"qtxt"},q.w.en));}
    else if(q.type==="es2en"){b.append(h("p",{cls:"qp"},"¿Qué significa? · What does it mean?"),h("div",{cls:"qtxt"},q.w.es),sayBtn(q.w.es));}
    else if(q.type==="listen"){const l=h("button",{cls:"qlisten","aria-label":"Escuchar",on:{click:()=>speak(q.w.es)}},"🔊");b.append(h("p",{cls:"qp"},"Escucha y elige · Listen and choose what you hear."),l);setTimeout(()=>speak(q.w.es),250);}
    else if(q.type==="sym"){b.append(h("p",{cls:"qp"},q.prompt),h("div",{cls:"qtxt"},q.show));}
    const fb=h("p",{cls:"fb","aria-live":"polite"});
    const opts=h("div",{cls:"opts"+(q.long||q.opts.some(o=>o.length>18)?" long":"")});
    q.opts.forEach(o=>opts.append(h("button",{cls:"opt",on:{click:e=>{
      opts.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      const ok=o===q.ans;
      if(ok){e.currentTarget.classList.add("right");score++;fb.textContent="¡Correcto! · Correct! ⭐";}
      else{e.currentTarget.classList.add("bad");[...opts.children].find(x=>x.textContent===q.ans).classList.add("right");fb.textContent="La respuesta es · The answer is: "+q.ans;}
      speak(q.say||(q.w?q.w.es:q.ans));setTimeout(next,1600);}}},o)));
    b.append(opts,fb);area.append(b);
  }
  function showOrder(q){
    const words=q.sent.split(" ");let order=shuffle(words.map((w,i)=>({w,i})));
    if(order.map(x=>x.w).join(" ")===q.sent&&words.length>1)order=order.reverse();
    const line=h("div",{cls:"line"}),bank=h("div",{cls:"bank"}),fb=h("p",{cls:"fb","aria-live":"polite"});
    const picked=[];
    const check=h("button",{cls:"btn primary",disabled:"true",on:{click:()=>{
      check.disabled=true;[...bank.children,...line.children].forEach(x=>x.disabled=true);
      const ans=picked.map(x=>x.w).join(" ");
      if(norm(ans)===norm(q.sent)){score++;fb.textContent="¡Correcto! · Correct! ⭐";}else fb.textContent="La respuesta es · The answer is: "+q.sent;
      speak(q.sent);setTimeout(next,2000);}}},"Comprobar · Check");
    function redraw(){line.innerHTML="";picked.forEach((x,k)=>line.append(h("button",{cls:"w",on:{click:()=>{picked.splice(k,1);x.btn.classList.remove("used");redraw();}}},x.w)));
      check.disabled=picked.length!==words.length;}
    order.forEach(x=>{const b=h("button",{cls:"w",on:{click:()=>{if(b.classList.contains("used"))return;b.classList.add("used");picked.push({w:x.w,btn:b});redraw();}}},x.w);x.btn=b;bank.append(b);});
    area.append(h("div",{cls:"qbox"},h("p",{cls:"qp"},"Ordena la frase · Put the words in order"),line,bank,h("div",{cls:"controls"},check),fb));
  }
  show();
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E6E78">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Basic Spanish · Alberto Garrido Hernández</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF6F4; --surface:#FFFFFF; --ink:#12343B; --muted:#4F6D72;
  --teal:#0E6E78; --teal-soft:#D5EEEB; --mango:#FFB627; --hibiscus:#E0405A; --lime:#4E9A2A;
  --line:#CFE5E2; --shadow:0 4px 0 #BFDCD8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D2226; --surface:#15333A; --ink:#EAF6F4; --muted:#A6C3C6;
    --teal:#4FC3CE; --teal-soft:#1C434A; --mango:#FFC247; --hibiscus:#FF6B81; --lime:#7CC952;
    --line:#24484F; --shadow:0 4px 0 #081518;
  }
}
:root[data-theme="dark"]{
  --bg:#0D2226; --surface:#15333A; --ink:#EAF6F4; --muted:#A6C3C6;
  --teal:#4FC3CE; --teal-soft:#1C434A; --mango:#FFC247; --hibiscus:#FF6B81; --lime:#7CC952;
  --line:#24484F; --shadow:0 4px 0 #081518;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:1.05rem;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--mango);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:.6rem 1rem 3rem}
.f{font-family:"Fredoka","Trebuchet MS",sans-serif}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin:0 0 .6rem}
.stars{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.15rem;background:var(--mango);color:#3A2600;padding:.3rem .8rem;border-radius:999px;white-space:nowrap}
.back{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.35rem .8rem;font-family:"Fredoka",sans-serif;font-weight:600;white-space:nowrap;font-size:clamp(.85rem,3.8vw,1.05rem)}

/* Home */
.hero{margin:0 0 1.5rem}
.owner{color:var(--muted);font-size:.95rem;line-height:1.3}
.owner .role{font-size:.78rem}
.hero small{color:var(--muted);display:block}
.hero h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(3.4rem,15vw,5.2rem);line-height:.95;margin:0 0 .5rem;color:var(--teal)}
.hero p{margin:0;color:var(--muted);max-width:52ch}
h2.sec{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.3rem;margin:1.75rem 0 .75rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem}
.unit{position:relative;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:.8rem .8rem .7rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.15rem;min-height:132px}
.unit:active{transform:translateY(3px);box-shadow:none}
.unit .num{font-family:"Fredoka",sans-serif;color:var(--muted);font-size:.85rem}
.unit .ic{font-size:2rem;line-height:1.2}
.unit .es{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;line-height:1.15}
.unit .en{color:var(--muted);font-size:.85rem;line-height:1.2}
.unit .got{position:absolute;top:.6rem;right:.7rem;font-size:.85rem;letter-spacing:-.1em}

/* Unit header */
.uhead{display:flex;gap:.8rem;align-items:center;margin-bottom:1rem}
.uhead .ic{font-size:2.8rem;line-height:1}
.uhead h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.05;margin:0;color:var(--teal)}
.uhead p{margin:.1rem 0 0;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(4.6em,1fr));gap:.3rem;margin-bottom:1rem;font-size:clamp(.78rem,3.4vw,1rem)}
.tabs button{min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:.4rem .15rem;font-family:"Fredoka",sans-serif;font-weight:600;font-size:inherit}
.tabs button[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.tabs button small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;font-size:.72rem;opacity:.8;line-height:1}
.tabs button{line-height:1.15}
.chips button small{opacity:.7;font-size:.82rem}
.bi .es2{display:block}
.bi .en2{display:block;font-size:.9em;opacity:.8;font-style:italic}
.hero .bi{margin:0;color:var(--muted);max-width:52ch}

.lrow{display:flex;gap:.5rem;align-items:stretch;margin-bottom:.5rem}
.lrow .ltab{margin-bottom:0;flex:1}
.infob{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;border:2px solid currentColor;background:transparent;color:var(--teal);font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:.8em;line-height:1;vertical-align:middle;padding:0}
.infob.big{width:2.6rem;height:auto;border-radius:14px;font-size:1.3rem;border-color:var(--mango);color:var(--ink);background:var(--surface)}
.infob.dark{color:#cfe3ea;font-size:.75rem}
.ovl{position:fixed;inset:0;background:rgba(10,25,30,.55);display:grid;place-items:center;padding:1rem;z-index:50}
.ovbox{background:var(--surface);color:var(--ink);border-radius:20px;padding:1.2rem 1.2rem 1rem;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.ovh{display:flex;align-items:center;gap:.5rem}
.ovh h2{font-family:"Fredoka",sans-serif;margin:0;color:var(--teal);font-size:1.3rem}
.ovi{font-size:1.5rem}
.ovbox p{margin:.6rem 0}
.ovbox ul{margin:.2rem 0 .6rem;padding-left:1.2rem}
.ovbox li{margin:.25rem 0}
.ovt{font-weight:700;margin-bottom:.2rem!important}
.ovbox .btn{width:100%;margin-top:.4rem}
/* Lesson */
.ltab{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;margin-bottom:.5rem;border-radius:16px;padding:.55rem .9rem;border:2px solid var(--mango);background:color-mix(in srgb,var(--mango) 18%,var(--surface));font-family:"Fredoka",sans-serif}
.ltab b{display:block;font-size:1.05rem}
.ltab small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-size:.8rem;color:var(--muted)}
.ltab .lti{font-size:1.7rem}
.ltab .ltarrow{margin-left:auto;font-size:1.1rem}
.ltab[aria-selected="true"]{background:var(--mango);color:#3A2600}
.ltab[aria-selected="true"] small{color:#5a4200}
.lesson{display:grid;gap:.7rem}
.board{background:linear-gradient(#3a4452,#262e38);border-radius:20px;padding:.55rem .55rem .7rem;box-shadow:0 6px 0 #161b21,0 10px 18px rgba(0,0,0,.18)}
.bbar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;color:#cfe3ea;font-family:"Fredoka",sans-serif;font-weight:600;font-size:.85rem;padding:.1rem .35rem .45rem}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.dots i{width:8px;height:8px;border-radius:50%;background:#56616f;display:block}
.dots i.past{background:#7fd1c6}.dots i.cur{background:#FFB627;transform:scale(1.25)}
.screen{position:relative;overflow:hidden;background:linear-gradient(160deg,#ffffff,#eaf5fb);color:#12343B;border-radius:12px;min-height:300px;max-height:62vh;overflow-y:auto;padding:.9rem;box-shadow:inset 0 0 0 2px #cfe0ea}
.bhead{font-family:"Fredoka",sans-serif;font-weight:700;color:#0E6E78;margin-bottom:.6rem}
.btitle{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.3rem;min-height:270px}
.btitle .bic{font-size:4rem;line-height:1}
.btitle .bh{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.4rem,6vw,2rem);color:#0E6E78;line-height:1.1}
.btitle .bsub{color:#4F6D72}
.bigstart{margin-top:.8rem;border:none;border-radius:999px;padding:.8rem 1.6rem;font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.2rem;background:linear-gradient(#5BEA9C,#2FC873);color:#0B3B22;box-shadow:0 5px 0 #1C8A4C}
.bigstart:active{transform:translateY(4px);box-shadow:none}
.blist{display:grid;gap:.45rem}
.brow{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:#fff;border:2px solid #d6e7ee;border-radius:14px;padding:.55rem .8rem;transition:transform .2s,background .2s}
.brow.on,.vcard.on,.bub.on{background:#FFF1CC;border-color:#FFB627;transform:scale(1.02)}
.bes{font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.15rem;color:#12343B;line-height:1.2}
.ben{color:#4F6D72;font-size:.9rem}
.bes.big{font-size:1.6rem}.ben.big{font-size:1.4rem;font-family:"Fredoka",sans-serif;font-weight:600}
.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}
.vcard{display:flex;flex-direction:column;align-items:center;gap:.1rem;background:#fff;border:2px solid #d6e7ee;border-radius:14px;padding:.5rem;transition:transform .2s}
.vcard .ve,.tfcard .ve{font-size:2.4rem;line-height:1.2}
.screen .chat .bub{background:#fff;border-color:#d6e7ee;color:#12343B}
.screen .chat .bub.r{background:#DDF3F1;border-color:#DDF3F1}
.screen .bub .who{color:#0E6E78}
.lyrics{display:grid;gap:.3rem;margin-bottom:.4rem}
.lyr{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.2rem;padding:.25rem .6rem;border-radius:10px;transition:all .2s;color:#12343B}
.lyr.on{background:#FFB627;color:#3A2600;transform:scale(1.04)}
.controls.sm{margin-top:.8rem}
.controls.sm .btn{font-size:.95rem;padding:.5rem .8rem}
.gq{display:flex;align-items:center;gap:.7rem;margin-bottom:.7rem;color:#4F6D72;font-family:"Fredoka",sans-serif}
.say.big{width:56px;height:56px;font-size:1.6rem;border-color:#FFB627;background:#fff}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.gopt{min-height:84px;border-radius:16px;background:#fff;border:3px solid #d6e7ee;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.1rem;color:#12343B;box-shadow:0 4px 0 #cfe0ea}
.gopt.pic{font-size:2.8rem}
.gopt.right,.tf.right{background:#3DDC84;border-color:#2FC873;color:#0B3B22}
.gopt.wrong,.tf.wrong{background:#FFD6DC;border-color:#E0405A;animation:shake .35s}
.gdone{text-align:center;padding:1.5rem 0;font-family:"Fredoka",sans-serif;font-weight:600;color:#12343B}
.gdone .big,.btitle .big{font-size:2rem;color:#0E6E78;font-family:"Fredoka",sans-serif;font-weight:700}
.tfcard{display:flex;flex-direction:column;align-items:center;gap:.3rem;background:#fff;border:2px solid #d6e7ee;border-radius:16px;padding:1rem;margin-bottom:.7rem}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.tf{border-radius:14px;padding:.8rem .4rem;font-family:"Fredoka",sans-serif;font-weight:700;font-size:1rem;border:3px solid #d6e7ee;background:#fff;color:#12343B;box-shadow:0 4px 0 #cfe0ea}
.tffb{text-align:center;font-weight:700;margin-top:.6rem;color:#12343B}
.conf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards;pointer-events:none}
@keyframes fall{to{top:110%;transform:translateX(30px) rotate(540deg)}}
.stagebot{display:grid;grid-template-columns:104px 1fr;align-items:end;gap:.4rem}
.teacher svg{display:block;width:104px;height:auto;overflow:visible}
.teacher{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.teacher .arm{transform-box:view-box;transform-origin:78px 103px}
.teacher.poke .arm{animation:poke .6s ease}
@keyframes poke{30%{transform:rotate(-14deg)}60%{transform:rotate(6deg)}}
@keyframes wave{50%{transform:rotate(-18deg)}}
@media (prefers-reduced-motion: reduce){.teacher,.teacher.poke .arm,.teacher.sing .arm{animation:none}.teacher.talk .mouth{animation-duration:.5s}}
.teacher .tbody{transform-box:view-box;transform-origin:60px 190px}
.teacher .larm{transform-box:view-box;transform-origin:42px 104px;transition:transform .25s}
.teacher .head{transform-box:view-box;transform-origin:60px 82px}
.teacher .eyes{transform-box:view-box;transform-origin:60px 55px;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.teacher .mouth{opacity:0}
.teacher.talk .mouth,.teacher.dance .mouth,.teacher.happy .mouth{opacity:1}
.teacher.talk .smile,.teacher.dance .smile,.teacher.happy .smile{opacity:0}
.teacher.talk .mouth{transform-box:fill-box;transform-origin:50% 0;animation:mouth .2s ease-in-out infinite alternate}
@keyframes mouth{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes nod{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.teacher.dance .tbody{animation:dance .5s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-6px)}}
.teacher.dance .larm{animation:wavel .5s ease-in-out infinite alternate}
@keyframes wavel{from{transform:rotate(60deg)}to{transform:rotate(140deg)}}
.teacher.dance .arm{animation:waver .5s ease-in-out infinite alternate}
@keyframes waver{from{transform:rotate(-10deg)}to{transform:rotate(15deg)}}
.teacher.dance .shadow{animation:shadow .5s ease-in-out infinite alternate}
@keyframes shadow{to{transform:scaleX(.85)}}
.teacher.happy .tbody{animation:jump .5s ease 3}
@keyframes jump{50%{transform:translateY(-14px)}}
.teacher.happy .larm{transform:rotate(155deg)}
.teacher .spark{opacity:0;transition:opacity .2s}
.teacher.happy .spark{opacity:1;animation:twinkle .5s ease-in-out infinite alternate}
.teacher .spark{transform-box:view-box;transform-origin:60px 80px}
@keyframes twinkle{to{transform:scale(1.08) rotate(4deg)}}
.teacher.oops .head{animation:nope .45s ease 2}
@keyframes nope{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){.teacher .tbody,.teacher .larm,.teacher .arm,.teacher .head,.teacher .eyes,.teacher .spark{animation:none!important}}
.teacher .tbody,.teacher .larm,.teacher .arm,.teacher .head,.teacher .brows,.teacher .pupils{transition:transform .8s ease-in-out}
.teacher .brows{transform-box:view-box;transform-origin:60px 45px}
.teacher .pupils{transform-box:view-box;transform-origin:60px 55px}
.teacher.g-side .larm{transform:rotate(9deg)}
.teacher.g-soft .larm{transform:rotate(-7deg)}
.teacher.g-lean .tbody{transform:rotate(2deg)}
.teacher.g-tilt .head{transform:rotate(-5deg)}
.teacher.g-brows .brows{transform:translateY(-2px)}
.teacher.g-look .pupils{transform:translate(1.8px,-1.6px)}
.teacher.to-bubble .arm{transform:rotate(56deg)}
.teacher.arm-rest .arm{transform:rotate(138deg)}
.teacher .stick{transform-box:view-box;transform-origin:103px 73px;transition:transform .5s ease-in-out}
.teacher.to-bubble .stick{transform:scale(.5)}
.teacher .rhand{transform-box:view-box;transform-origin:103px 73px}
.teacher.arm-rest .rhand{transform:rotate(-79.2deg) scaleY(-1) rotate(79.2deg) scale(.78)}
.teacher.to-bubble .rhand{transform:scale(.85)}
.teacher .rhand{transition:transform .5s ease-in-out}
.teacher{position:relative;z-index:2}
.teacher .arm{transition:transform .5s ease-in-out!important}
.bubble{text-align:left;color:var(--ink);font:inherit;cursor:pointer;position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:.7rem .9rem;margin-bottom:1.2rem;min-height:3.2rem;font-size:1rem;line-height:1.4}
.bubble::before{content:"";position:absolute;left:-10px;bottom:16px;border:8px solid transparent;border-right-color:var(--line)}
.bubble .esb{color:var(--teal)}
.lnav{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:.5rem}
.lnav .btn{padding:.45rem .3rem;line-height:1.1}
.lnav .l1{display:block;font-size:clamp(.9rem,4vw,1.05rem)}
.lnav .l2{display:block;font-size:.75rem;opacity:.8}
.lockcard{text-align:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:1.4rem 1rem;box-shadow:var(--shadow)}
.lockcard .lockic{font-size:3.4rem}
.lockcard h2{font-family:"Fredoka",sans-serif;margin:.2rem 0 0;color:var(--teal)}
.lockcard p{margin:.15rem 0}
.lockcard .en2{color:var(--muted);font-style:italic}
.lockcard .inl{display:flex;flex-direction:column;gap:.3rem;margin:1rem auto;max-width:300px;text-align:left;background:var(--bg);border-radius:14px;padding:.7rem .9rem;font-weight:700}
.tkey{background:none;border:none;color:var(--muted);font-size:.85rem;text-decoration:underline;margin-top:.4rem}
.tform{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:.6rem}
.tform[hidden],.tafter[hidden]{display:none}
.tform input{font:inherit;padding:.55rem .8rem;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;flex:1 1 160px}
.tafter{display:flex;flex-direction:column;gap:.5rem;align-items:center;margin-top:.6rem}
.tmsg{min-height:1.3em;font-weight:700}
.screen .btn{background:#fff;color:#12343B;border-color:#d6e7ee;box-shadow:0 4px 0 #cfe0ea}
.screen .btn.primary{background:#FFB627;border-color:#FFB627;color:#3A2600;box-shadow:0 4px 0 #D9920A}
.screen .say{background:#fff;color:#12343B;border-color:#FFB627}
.starinfo{display:flex;gap:.6rem;align-items:flex-start;margin-top:.8rem;background:var(--surface);border:2px dashed var(--mango);border-radius:14px;padding:.6rem .8rem;font-size:.92rem;line-height:1.35}
.starinfo .si{font-size:1.4rem;line-height:1}
.starinfo i{color:var(--muted)}
.apkrow{display:flex;align-items:center;gap:.5rem;margin:.1rem 0 .8rem}
.apkrow .apkbtn{margin:0}
.apkinfo{width:2rem;height:2rem;border-radius:50%;border:2px solid #2FC873;background:var(--surface);color:#1C8A4C;font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:1rem;line-height:1;padding:0;flex:0 0 auto}
.ovbox ol.steps{padding-left:1.3rem;margin:.4rem 0 .6rem}
.ovbox ol.steps li{margin:.5rem 0}
.ovbox ol.steps li::marker{font-weight:700;color:var(--teal)}
.incomplete{color:#12343B;margin:.6rem 0 0;line-height:1.4}
.incomplete i{color:#4F6D72}
.hint{color:var(--muted);margin:0 0 1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.chips button{background:transparent;border:2px solid var(--line);border-radius:10px;padding:.25rem .7rem;font-size:.95rem}
.chips button[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--ink);font-weight:700}

/* Flashcard */
.stage{perspective:1200px;max-width:360px;margin:0 auto}
.card{position:relative;width:100%;aspect-ratio:4/4.4;border:none;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;background:var(--surface);border:3px solid var(--line);box-shadow:var(--shadow);padding:1rem;text-align:center}
.face .big{font-size:clamp(5rem,26vw,7.5rem);line-height:1.1}
.face .txt{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(1.6rem,7vw,2.2rem);line-height:1.15}
.face .tap{color:var(--muted);font-size:.95rem}
.face.back2{transform:rotateY(180deg);background:var(--teal);border-color:var(--teal);color:#fff}
.face.back2 .word{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.8rem,9vw,2.8rem);line-height:1.1}
.face.back2 .sub{color:#DDF3F1}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
.btn{border-radius:14px;padding:.6rem 1rem;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.primary{background:var(--mango);border-color:var(--mango);color:#3A2600}
.btn:disabled{opacity:.45;cursor:default}

const $=s=>document.querySelector(s);
function h(tag,attrs={},...kids){const el=document.createElement(tag);for(const k in attrs){if(k==="on")for(const ev in attrs.on)el.addEventListener(ev,attrs.on[ev]);else if(k==="cls")el.className=attrs[k];else el.setAttribute(k,attrs[k]);}kids.flat().forEach(c=>{if(c==null)return;el.append(c.nodeType?c:document.createTextNode(c));});return el;}
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);

function items(u){const out=[];for(const g in u.v)u.v[g].forEach(s=>{const[es,en,e]=s.split("|");out.push({es,en,e:e||"",g});});return out;}

/* Speech */
let esVoice=null;
function loadVoices(){if(!("speechSynthesis" in window))return;const vs=speechSynthesis.getVoices();esVoice=vs.find(v=>/^es(-|_)(MX|US|419)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speak(text,opts={}){
  if(!("speechSynthesis" in window))return;
  if(!opts.queue)speechSynthesis.cancel();
  const clean=text.replace(/\(.*?\)/g,"").replace(/…/g,"").replace(/ \/ /g,", ");
  if(/^i griega$/i.test(clean.trim())){speak("i",Object.assign({},opts,{end:null}));speak("griega",Object.assign({},opts,{queue:true}));return;}
  const u=new SpeechSynthesisUtterance(clean);u.lang="es-ES";u.rate=opts.rate||.85;u.pitch=opts.pitch||1;
  if(esVoice)u.voice=esVoice;if(opts.end)u.onend=opts.end;
  speechSynthesis.speak(u);
}

function timePhrase(hh,mm){
  let hr=hh,tail;
  if(mm===0)tail="en punto";else if(mm===15)tail="y cuarto";else if(mm===30)tail="y media";
  else if(mm<30)tail="y "+nw(mm);else{hr=hh%12+1;tail="menos "+nw(60-mm);}
  return (hr===1?"Es la una":"Son las "+nw(hr))+" "+tail;
}
function makeQuiz(u){
  const pool=items(u), global=ALL.flatMap(items);

  const distract=(ans,key)=>{let c=shuffle(pool.filter(x=>x[key]!==ans[key]&&x.es!==ans.es&&x.en!==ans.en));
    if(c.length<3)c=c.concat(shuffle(global.filter(x=>x.g===ans.g?false:x[key]!==ans[key])));
    const out=[],seen=new Set([ans[key]]);for(const x of c){if(!seen.has(x[key])){seen.add(x[key]);out.push(x[key]);}if(out.length===3)break;}return out;};
  const n=10;
  for(let k=0;k<n;k++){
    if(u.special==="math"&&k%2===0){
      const add=Math.random()<.5;let a=1+Math.floor(Math.random()*40),b=1+Math.floor(Math.random()*20);if(!add&&b>a)[a,b]=[b,a];
      const r=add?a+b:a-b,op=add?"más":"menos";
      const right=`${nw(a)} ${op} ${nw(b)} es igual a ${nw(r)}`;
      const wrongs=new Set();while(wrongs.size<3){const d=1+Math.floor(Math.random()*3);const t=pick([0,1,2]);
        const aa=t===0?a+d:a,bb=t===1?b+d:b,rr=t===2?r+d:r;wrongs.add(`${nw(aa)} ${op} ${nw(bb)} es igual a ${nw(rr)}`);}
      qs.push({type:"sym",prompt:"Léelo en español · Read it in Spanish",show:`${a} ${add?"+":"−"} ${b} = ${r}`,ans:right,opts:shuffle([right,...wrongs]),long:true,say:right});continue;
    }
    if(u.special==="clock"&&k%2===0){
      const hh=1+Math.floor(Math.random()*12),mm=pick([0,15,30,0,5+Math.floor(Math.random()*20),35+Math.floor(Math.random()*20)]);
      const right=timePhrase(hh,mm);const wrongs=new Set();
      while(wrongs.size<3){const w=timePhrase(1+Math.floor(Math.random()*12),pick([0,10,15,20,30,40,45,50]));if(w!==right)wrongs.add(w);}
      qs.push({type:"sym",prompt:"¿Qué hora es? · What time is it?",show:`🕐 ${hh}:${String(mm).padStart(2,"0")}`,ans:right,opts:shuffle([right,...wrongs]),long:true,say:right});continue;
    }
    if(u.s.length&&Math.random()<.2){const sent=pick(u.s);qs.push({type:"order",sent});continue;}
    const w=pick(pool);
    const types=["en2es","es2en","listen"];if(w.e)types.push("pic","pic");
    const t=pick(types);
    if(t==="es2en"){qs.push({type:t,w,ans:w.en,opts:shuffle([w.en,...distract(w,"en")])});}
    else qs.push({type:t,w,ans:w.es,opts:shuffle([w.es,...distract(w,"es")])});
  }
  return qs;
}

      h("div",{cls:"rt"},"Gana estrellas · Earn stars"),
      h("div",{cls:"rr"},h("span",{},"⭐⭐⭐ 9–10"),h("span",{},"⭐⭐ 7–8"),h("span",{},"⭐ 4–6")),
      h("div",{cls:"rb"},best?"Tu mejor resultado · Your best: "+"⭐".repeat(best):"Todavía no tienes estrellas aquí · No stars here yet.")),
    live,h("div",{cls:"progress"},bar),area);
  function next(){qi++;show();}
  function show(){
    bar.style.width=(qi/qs.length*100)+"%";area.innerHTML="";upd();
    if(qi>=qs.length){
      const pct=score/qs.length,st=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
      if(st>(prog[idx]||0)){prog[idx]=st;save();}
      area.append(h("div",{cls:"qbox result"},h("p",{cls:"qp"},"Tu resultado · Your score"),h("div",{cls:"big"},score+" / "+qs.length),
        h("div",{cls:"st","aria-label":st+" stars"},st?"⭐".repeat(st):"💪"),
        h("p",{},st===3?"¡Excelente! · Excellent!":st>=1?"¡Muy bien! · Well done!":"¡Sigue practicando! · Keep practising! Try the cards first."),
        h("div",{cls:"controls"},h("button",{cls:"btn primary",on:{click:()=>render()}},"Otra vez · Try again"),h("button",{cls:"btn",on:{click:()=>home()}},"Unidades | Units"))));
      if(st)setTimeout(()=>speak("¡Muy bien!"),200);
      const sc=$(".stars");sc.textContent="⭐ "+totalStars();
      if(st>best){sc.classList.remove("pop");void sc.offsetWidth;sc.classList.add("pop");
        const r=area.querySelector(".result");r.insertBefore(h("p",{cls:"won"},"¡Ganaste "+(st-best)+" "+(st-best===1?"estrella nueva":"estrellas nuevas")+"! ⭐ You won "+(st-best)+" new "+(st-best===1?"star!":"stars!")),r.querySelector(".controls"));
        box.querySelector(".rules .rb").textContent="Tu mejor resultado · Your best: "+"⭐".repeat(st);}
      else if(st&&st<=best){const r=area.querySelector(".result");r.insertBefore(h("p",{cls:"qp"},"Tu mejor resultado sigue siendo "+"⭐".repeat(best)+". ¡Inténtalo otra vez! · Your best is still "+"⭐".repeat(best)+". Try again!"),r.querySelector(".controls"));}
      return;
    }
    const q=qs[qi];
    if(q.type==="order")return showOrder(q);
    const b=h("div",{cls:"qbox"});
    if(q.type==="pic"){b.append(h("p",{cls:"qp"},"¿Qué es esto? · What is it in Spanish?"),h("div",{cls:"qbig"},q.w.e));}
    else if(q.type==="en2es"){b.append(h("p",{cls:"qp"},"¿Cómo se dice en español? · How do you say it in Spanish?"),h("div",{cls:"qtxt"},q.w.en));}
    else if(q.type==="es2en"){b.append(h("p",{cls:"qp"},"¿Qué significa? · What does it mean?"),h("div",{cls:"qtxt"},q.w.es),sayBtn(q.w.es));}
    else if(q.type==="listen"){const l=h("button",{cls:"qlisten","aria-label":"Escuchar",on:{click:()=>speak(q.w.es)}},"🔊");b.append(h("p",{cls:"qp"},"Escucha y elige · Listen and choose what you hear."),l);setTimeout(()=>speak(q.w.es),250);}
    else if(q.type==="sym"){b.append(h("p",{cls:"qp"},q.prompt),h("div",{cls:"qtxt"},q.show));}
    const fb=h("p",{cls:"fb","aria-live":"polite"});
    const opts=h("div",{cls:"opts"+(q.long||q.opts.some(o=>o.length>18)?" long":"")});
    q.opts.forEach(o=>opts.append(h("button",{cls:"opt",on:{click:e=>{
      opts.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      const ok=o===q.ans;
      if(ok){e.currentTarget.classList.add("right");score++;fb.textContent="¡Correcto! · Correct! ⭐";}
      else{e.currentTarget.classList.add("bad");[...opts.children].find(x=>x.textContent===q.ans).classList.add("right");fb.textContent="La respuesta es · The answer is: "+q.ans;}
      speak(q.say||(q.w?q.w.es:q.ans));setTimeout(next,1600);}}},o)));
    b.append(opts,fb);area.append(b);
  }
  function showOrder(q){
    const words=q.sent.split(" ");let order=shuffle(words.map((w,i)=>({w,i})));
    if(order.map(x=>x.w).join(" ")===q.sent&&words.length>1)order=order.reverse();
    const line=h("div",{cls:"line"}),bank=h("div",{cls:"bank"}),fb=h("p",{cls:"fb","aria-live":"polite"});
    const picked=[];
    const check=h("button",{cls:"btn primary",disabled:"true",on:{click:()=>{
      check.disabled=true;[...bank.children,...line.children].forEach(x=>x.disabled=true);
      const ans=picked.map(x=>x.w).join(" ");
      if(norm(ans)===norm(q.sent)){score++;fb.textContent="¡Correcto! · Correct! ⭐";}else fb.textContent="La respuesta es · The answer is: "+q.sent;
      speak(q.sent);setTimeout(next,2000);}}},"Comprobar · Check");
    function redraw(){line.innerHTML="";picked.forEach((x,k)=>line.append(h("button",{cls:"w",on:{click:()=>{picked.splice(k,1);x.btn.classList.remove("used");redraw();}}},x.w)));
      check.disabled=picked.length!==words.length;}
    order.forEach(x=>{const b=h("button",{cls:"w",on:{click:()=>{if(b.classList.contains("used"))return;b.classList.add("used");picked.push({w:x.w,btn:b});redraw();}}},x.w);x.btn=b;bank.append(b);});
    area.append(h("div",{cls:"qbox"},h("p",{cls:"qp"},"Ordena la frase · Put the words in order"),line,bank,h("div",{cls:"controls"},check),fb));
  }
  show();
}

home();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>

.bi .es2{display:block}

.ovh{display:flex;align-items:center;gap:.5rem}

.ovbox p{margin:.6rem 0}

.blist{display:grid;gap:.45rem}

.screen .chat .bub{background:#fff;border-color:#d6e7ee;color:#12343B}

.lyrics{display:grid;gap:.3rem;margin-bottom:.4rem}

.gopt.pic{font-size:2.8rem}
.gopt.right,.tf.right{background:#3DDC84;border-color:#2FC873;color:#0B3B22}
.gopt.wrong,.tf.wrong{background:#FFD6DC;border-color:#E0405A;animation:shake .35s}
.gdone{text-align:center;padding:1.5rem 0;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:600;color:#12343B}

.tfcard{display:flex;flex-direction:column;align-items:center;gap:.3rem;background:#fff;border:2px solid #d6e7ee;border-radius:16px;padding:1rem;margin-bottom:.7rem}

.tf{border-radius:14px;padding:.8rem .4rem;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:700;font-size:1rem;border:3px solid #d6e7ee;background:#fff;color:#12343B;box-shadow:0 4px 0 #cfe0ea}
.tffb{text-align:center;font-weight:700;margin-top:.6rem;color:#12343B}
.conf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards;pointer-events:none}
@keyframes fall{to{top:110%;transform:translateX(30px) rotate(540deg)}}
.stagebot{display:grid;grid-template-columns:104px 1fr;align-items:end;gap:.4rem}
.teacher svg{display:block;width:104px;height:auto;overflow:visible}
.teacher{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.teacher .arm{transform-box:view-box;transform-origin:78px 103px}
.teacher.poke .arm{animation:poke .6s ease}
@keyframes poke{30%{transform:rotate(-14deg)}60%{transform:rotate(6deg)}}
@keyframes wave{50%{transform:rotate(-18deg)}}
@media (prefers-reduced-motion: reduce){.teacher,.teacher.poke .arm,.teacher.sing .arm{animation:none}.teacher.talk .mouth{animation-duration:.5s}}
.teacher .tbody{transform-box:view-box;transform-origin:60px 190px}
.teacher .larm{transform-box:view-box;transform-origin:42px 104px;transition:transform .25s}
.teacher .head{transform-box:view-box;transform-origin:60px 82px}
.teacher .eyes{transform-box:view-box;transform-origin:60px 55px;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.teacher .mouth{opacity:0}
.teacher.talk .mouth,.teacher.dance .mouth,.teacher.happy .mouth{opacity:1}
.teacher.talk .smile,.teacher.dance .smile,.teacher.happy .smile{opacity:0}
.teacher.talk .mouth{transform-box:fill-box;transform-origin:50% 0;animation:mouth .2s ease-in-out infinite alternate}
@keyframes mouth{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes nod{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.teacher.dance .tbody{animation:dance .5s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-6px)}}
.teacher.dance .larm{animation:wavel .5s ease-in-out infinite alternate}
@keyframes wavel{from{transform:rotate(60deg)}to{transform:rotate(140deg)}}
.teacher.dance .arm{animation:waver .5s ease-in-out infinite alternate}
@keyframes waver{from{transform:rotate(-10deg)}to{transform:rotate(15deg)}}
.teacher.dance .shadow{animation:shadow .5s ease-in-out infinite alternate}
@keyframes shadow{to{transform:scaleX(.85)}}
.teacher.happy .tbody{animation:jump .5s ease 3}

.teacher.happy .larm{transform:rotate(155deg)}
.teacher .spark{opacity:0;transition:opacity .2s}
.teacher.happy .spark{opacity:1;animation:twinkle .5s ease-in-out infinite alternate}
.teacher .spark{transform-box:view-box;transform-origin:60px 80px}
@keyframes twinkle{to{transform:scale(1.08) rotate(4deg)}}
.teacher.oops .head{animation:nope .45s ease 2}
@keyframes nope{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){.teacher .tbody,.teacher .larm,.teacher .arm,.teacher .head,.teacher .eyes,.teacher .spark{animation:none!important}}
.teacher .tbody,.teacher .larm,.teacher .arm,.teacher .head,.teacher .brows,.teacher .pupils{transition:transform .8s ease-in-out}
.teacher .brows{transform-box:view-box;transform-origin:60px 45px}
.teacher .pupils{transform-box:view-box;transform-origin:60px 55px}
.teacher.g-side .larm{transform:rotate(9deg)}

.teacher .rhand{transform-box:view-box;transform-origin:103px 73px}

.teacher.to-bubble .rhand{transform:scale(.85)}
.teacher .rhand{transition:transform .5s ease-in-out}
.teacher{position:relative;z-index:2}
.teacher .arm{transition:transform .5s ease-in-out!important}

const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=b=>{const a=new Uint8Array(b);let s="";for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);};
const LKEY="bs-lessons-v1",DKEY="bs-lessons-done";
let unlocked={},doneL={};
try{unlocked=JSON.parse(localStorage.getItem(LKEY))||{};}catch(e){}
try{doneL=JSON.parse(localStorage.getItem(DKEY))||{};}catch(e){}
const saveUnlocked=()=>{try{localStorage.setItem(LKEY,JSON.stringify(unlocked));}catch(e){}try{stadEver();}catch(e){}};
const EKEY="bs-unlock-exp-v1",TKEY="bs-clock-v1";
let UEXP={};try{UEXP=JSON.parse(localStorage.getItem(EKEY))||{};}catch(e){}
const saveExp=()=>{try{localStorage.setItem(EKEY,JSON.stringify(UEXP));}catch(e){}};
let lastSeen=0;try{lastSeen=+localStorage.getItem(TKEY)||0;}catch(e){}
function seeTime(t){if(t>lastSeen){lastSeen=t;try{localStorage.setItem(TKEY,String(t));}catch(e){}}}
const trustedNow=()=>{seeTime(Date.now());return lastSeen;};
async function syncServerTime(){try{if(!navigator.onLine)return;const r=await fetch("./?t="+Date.now(),{method:"HEAD",cache:"no-store"});const d=Date.parse(r.headers.get("Date"));if(d){seeTime(d);checkExpiry(true);}}catch(e){}}
const DURATIONS=[["1 mes · 1 month",30],["3 meses · 3 months",91],["6 meses · 6 months",182],["1 año · 1 year",365],["♾️ Para siempre · Forever",0]];
const expFor=days=>days?trustedNow()+days*864e5:0;
function setUnlockExp(i,days){if(days)UEXP[i]=expFor(days);else delete UEXP[i];saveExp();}
const fmtDate=t=>new Date(t).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"});
const daysLeft=i=>UEXP[i]?Math.ceil((UEXP[i]-trustedNow())/864e5):null;
function checkExpiry(rerender){
  const now=trustedNow(),closed=[];
  for(const k of Object.keys(UEXP)){if(UEXP[k]&&now>UEXP[k]){delete unlocked[k];delete UEXP[k];closed.push(+k);}}
  if(closed.length){saveUnlocked();saveExp();
    if(rerender){if(cur==null)home();else render();}
    setTimeout(()=>overlay("Lessons closed",c=>[h("div",{cls:"ovh"},h("span",{cls:"ovi"},"⏰"),h("h2",{},"Lección cerrada · Lesson closed")),
      h("p",{},"Terminó el tiempo de estas lecciones. Tus estrellas y premios se quedan contigo. · Time is up for these lessons. You keep your stars and rewards."),
      h("ul",{},...closed.map(i=>h("li",{},U[i].i+" "+(i+1)+". "+U[i].t))),
      h("p",{},"Pídele a tu maestro de español que las renueve. · Ask your Spanish teacher to renew them."),
      h("button",{cls:"btn primary",on:{click:c}},"OK")]),300);}
  return closed;
}
function durPicker(){
  let sel=30;const wrap=h("div",{cls:"durs",role:"radiogroup","aria-label":"Duración · Duration"});
  const btns=DURATIONS.map(([l,d])=>{const b=h("button",{cls:"dur"+(d===sel?" on":""),role:"radio","aria-checked":String(d===sel),on:{click:()=>{sel=d;btns.forEach((x,j)=>{const on=DURATIONS[j][1]===d;x.classList.toggle("on",on);x.setAttribute("aria-checked",String(on));});}}},l);return b;});
  wrap.append(h("div",{cls:"dlab"},"⏳ ¿Por cuánto tiempo? · For how long?"),...btns);
  return {el:wrap,get days(){return sel;}};
}
function expiryNote(i){
  const dl=daysLeft(i);if(dl==null||!isUnlocked(i)||i===DEMO_IDX)return null;
  const soon=dl<=7;
  return h("div",{cls:"expnote"+(soon?" soon":"")},
    h("span",{},(soon?"⏳ ":"📅 ")+(soon?"Esta unidad se cierra el ":"Abierta hasta el ")+fmtDate(UEXP[i])+(soon?" · Closes on ":" · Open until ")+new Date(UEXP[i]).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})+(soon?". Ask your teacher to renew.":"")),
    h("button",{cls:"tkey",on:{click:()=>renewDialog(i)}},"🔑 Renovar · Renew"));
}
function renewDialog(i){
  const pw=h("input",{type:"password",autocomplete:"off",placeholder:"Contraseña · Password"});const dp=durPicker();const msg=h("p",{cls:"tmsg","aria-live":"polite"});
  overlay("Renew",close=>[h("div",{cls:"ovh"},h("span",{cls:"ovi"},"🔑"),h("h2",{},"Renovar · Renew")),h("p",{},U[i].i+" "+(i+1)+". "+U[i].t),dp.el,
    h("div",{cls:"tform"},pw,h("button",{cls:"btn primary",on:{click:async()=>{msg.textContent="…";try{const kek=await teacherKey(pw.value);unlocked[i]=await unwrapKey(kek,i);saveUnlocked();setUnlockExp(i,dp.days);pw.value="";close();render();}catch(e){msg.textContent="❌ Contraseña incorrecta · Wrong password";}}}},"Renovar · Renew")),msg,
    h("button",{cls:"btn",on:{click:close}},"Cerrar · Close")]);
}
const saveDone=()=>{try{localStorage.setItem(DKEY,JSON.stringify(doneL));}catch(e){}};
const hasLesson=i=>i<LESSONS_ENC.L.length||i===DEMO_IDX;
async function teacherKey(pass){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:ub64(LESSONS_ENC.salt),iterations:LESSONS_ENC.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function unwrapKey(kek,i){const[, ,wiv,wk]=LESSONS_ENC.L[i];return b64e(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(wiv)},kek,ub64(wk)));}
async function loadLesson(i){
  if(i===DEMO_IDX)return DEMO_LESSON;
  const k=unlocked[i];if(!k)return null;
  const key=await crypto.subtle.importKey("raw",ub64(k),"AES-GCM",false,["decrypt"]);
  const[iv,ct]=LESSONS_ENC.L[i];
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(iv)},key,ub64(ct))));

/* Download all audio once, for offline use */
/* Installed app (Android app, or "Add to Home Screen") → download everything for offline use.
   Just visiting in the browser (e.g. from the promo page) → only download what is used. */
function isInstalledApp(){
  try{
    if(/[?&]app=1/.test(location.search))return true;
    if(window.matchMedia&&(matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||matchMedia("(display-mode: minimal-ui)").matches))return true;
    if(navigator.standalone)return true;
    if((document.referrer||"").startsWith("android-app://"))return true;
    if(localStorage.getItem("bs-installed")==="1")return true;
  }catch(e){}
  return false;
}
try{if(isInstalledApp())localStorage.setItem("bs-installed","1");}catch(e){}
async function prefetchAllAudio(){
  if(!isInstalledApp())return;
  try{
    if(!("serviceWorker" in navigator)||!("caches" in window)||(location.protocol!=="https:"&&location.hostname!=="localhost")||!navigator.onLine)return;
    await navigator.serviceWorker.ready;
    if(!navigator.serviceWorker.controller){await new Promise(r=>{navigator.serviceWorker.addEventListener("controllerchange",r,{once:true});setTimeout(r,8000);});}
    if(!navigator.serviceWorker.controller)return;
    const urls=Object.values(AUDIO_FILES).map(f=>"audio/"+f+".mp3");
    const missing=[];for(const u of urls){if(!(await caches.match(u,{ignoreSearch:true})))missing.push(u);}
    if(!missing.length)return;
    const total=missing.length;let done=0;
    const pill=h("div",{cls:"dlpill",role:"status","aria-live":"polite"});document.body.append(pill);
    const upd=()=>{pill.textContent="⬇️ Downloading audio for offline use… "+Math.round(done/total*100)+"%";};upd();
    const worker=async()=>{while(missing.length){const u=missing.shift();try{const r=await fetch(u);if(r.ok)await r.arrayBuffer();}catch(e){}done++;upd();}};
    await Promise.all([worker(),worker()]);
    pill.textContent="✅ Audio ready — works without internet";pill.classList.add("ok");setTimeout(()=>pill.remove(),4000);
  }catch(e){}
}

ake a mistake. <b>Press and hold</b> Coco to hide him, and tap the small <b>🦜</b> button to bring him back.", "<b>🎁 Free demo:</b> <i>Los números del 1 al 10</i> is completely open so you can try everything.", "<b>🗺️ My learning path</b> shows all your lessons and rewards on a map.", "<b>📤 Share my progress</b> creates a card to send to your family and friends.", "<b>Units:</b> 28 units from the Spanish workbooks, plus extra units of vocabulary and grammar, which are always open.", "<b>The Books:</b> the Spanish workbooks for grades 1 to 6, available at Old Harbour Primary School."]], ["🎨", "Temas · Themes", ["Choose your theme on the home screen, right under the title. It is saved on your phone. <b>Stars, rewards and lessons are exactly the same in every theme.</b>", "<b>🎨 Normal:</b> the original look of the app.", "<b>⚽ Fútbol:</b> green pitch colours, with soccer balls and trophies in the background. Your stars become <b>balls ⚽</b>. Coco wears a yellow <b>number 10 shirt</b>. Tap the ball next to Coco to watch him kick it. Every right answer is a kick with a <b>¡GOOOL!</b>, and if you get 3, 5, 7 or 10 right in a row, Coco talks like a sports announcer.", "<b>🏟️ My stadium:</b> in the Fútbol theme you build your own stadium on the home screen. It grows when you open more lessons: stands, lights and scoreboard, full crowd, roof and sign, fireworks, and at the end the golden trophy. Under the picture you can see how many lessons you need for the next upgrade. You also see the stadium behind the penalty field.<div class=\"gimgs\" data-kind=\"stadium\"></div>", "<b>🥅 Penalty quiz:</b> in the <b>Prueba · Quiz</b> every question is a penalty. A right answer is a <b>goal</b>, and a wrong answer is saved by the goalkeeper 🧤. You see your final score, like 8 – 2. The stars you win are the same as in any other theme. Each lesson, and the free Demo, has <b>1 penalty shootout a day</b>, the first time you do its quiz that day. The more lessons you have, the more penalties you can play, and each lesson has a different rival. The quiz itself has no limit. In <b>Vocabulario y gramática</b> there are no penalties, the quiz is a normal one.", "<b>👑 Princesa:</b> pink colours, with crowns, butterflies and flowers in the background. Your stars become <b>crowns 👑</b> and Coco wears a golden crown. When you answer right, Coco puts on stylish sunglasses with a sparkle. When you make a mistake, he tilts his head and a shiny <b>?</b> appears with a sweet message to try again. When you move between screens, a trail of pink and gold sparkles ✨ crosses the screen.", "<b>🏰 My castle:</b> in the Princesa theme you build your own castle on the home screen. It grows when you open more lessons: wall, towers, gate and flags, golden towers, rainbow and fireworks, and at the end the complete castle with hearts and sparkles. Under the picture you can see how many lessons you need for the next upgrade. You also see it behind Coco in your closet.<div class=\"gimgs\" data-kind=\"castle\"></div>", "<b>👜 Mi armario · My closet</b> (Princesa): every <b>5 correct answers</b> in a <b>lesson</b> (not in Vocabulario y gramática) a magic bag opens and gives Coco a new accessory: sunglasses, bow, pearls, handbag, earrings, flower, scarf, magic wand, glass slippers, royal cape, diamond necklace, fairy wings, sparkly bracelets and cheek glitter. Many of them come back later in a new colour (pink, blue, silver, ruby…), so there are <b>28 gifts in total</b>, one for each lesson. Each lesson, and the free Demo, gives only <b>one gift</b>, so repeating the same lesson does not give more. Coco wears each new one right away. Open <b>👜 Mi armario</b> on the home screen to see them all, and tap one to put it on or take it off. The locked ones show a grey shadow: you win them in the lessons.<div class=\"gimgs coco\" data-kind=\"coco\"></div>", "Gifts are earned only while the <b>Princesa</b> theme is on. Your theme and your closet are saved on your phone."]], ["📚", "Dentro de una unidad · Inside a unit", ["<b>👨‍🏫 Lección con el profe · Lesson with the teacher:</b> the main class (see below).", "<b>Tarjetas · Cards:</b> words with pictures. Tap <b>🔊</b> to listen and tap the card to see the English.", "<b>Frases · Phrases:</b> the questions and answers of the unit.", "<b>Diálogo · Dialogue:</b> a short conversation. Tap <b>Listen</b> to hear it all.", "<b>Parejas · Match:</b> join each Spanish word with its English meaning.", "<b>Prueba · Quiz:</b> 10 questions to win stars."]], ["👨‍🏫", "La lección con el profe · The lesson with the teacher", ["Tap <b>¡Empezar! · Start!</b>. The animated teacher explains on the board, step by step. The words he says light up on the board.", "Use <b>Siguiente · Next</b>, <b>Atrás · Back</b> and <b>Repetir · Again</b> to move through the lesson.", "Each lesson has: explanation with patterns and rules, <b>Listen and repeat</b>, <b>Practice</b> (choose the right word), a <b>song</b>, two <b>games</b>, a dialogue and <b>¡Tu turno! · Your turn!</b> where you answer out loud.", "<b>To complete a lesson you must play both games.</b> Then you see 🏆 <i>Lesson complete!</i>"]], ["⭐", "Estrellas y la prueba · Stars and the quiz", ["Each quiz has 10 questions: <b>9–10 correct = ⭐⭐⭐</b>, <b>7–8 = ⭐⭐</b>, <b>4–6 = ⭐</b>. Your best result is saved.", "Your teacher can also give you <b>extra stars</b> 🍎 for good work, participation, homework and more.", "<b>⚽ In the Fútbol theme</b> the quiz is a penalty shootout, and in <b>👑 Princesa</b> your right answers also win gifts for your closet. The stars you win are the same in every theme."]], ["🏅", "Premios · Rewards", ["<b>🥉 10 stars</b> bronze medal · <b>🥈 25</b> silver medal · <b>🥇 50</b> gold medal · <b>🏆 100</b> champion trophy.", "<b>🎁 Free lesson (50 stars):</b> you get a code. Show it to your Spanish teacher and choose a free lesson. It can only be used once.", "<b>📜 Certificate (100 stars):</b> your certificate with your name and photo. Show the app with your 100 stars to your teacher to have it signed. You can print it or save it as PDF (Print → Save as PDF).", "<b>🍎 Teacher's rewards:</b> your Spanish teacher can give you <b>extra stars</b> (from +1 to +10) for excellent work, participation, homework, speaking Spanish, good behaviour or helping a classmate. You will see a celebration <i>Your teacher gave you +3 ⭐!</i>, and every teacher reward appears in <b>My rewards</b> with the reason and the date. These stars <b>count for your medals, the free lesson and the certificate</b>. Only the teacher can give them, with his password.", "Tap <b>🗺️ My path</b> to see where you are and how many stars you need for the next reward."]], ["🔒", "Desbloquear lecciones · Unlocking lessons", ["Units 1 to 28 are locked 🔒. <b>Ask your Spanish teacher</b> to unlock them on your phone.", "Lessons can be open for <b>1 month, 3 months, 6 months, 1 year</b> or forever. You will see the date inside the unit.", "<b>7 days before</b> it closes you will see a red message. Ask your teacher to <b>renew</b> it.", "When a lesson closes, <b>you keep all your stars and rewards.</b>"]], ["📶", "Sin internet y actualizaciones · Offline and updates", ["After the first audio download, the app works <b>without internet</b>.", "When there is a new version, it installs itself: open the app with internet, close it and open it again.", "⚠️ Your stars, rewards, name, theme, closet and unlocked lessons are saved <b>on your phone</b>. If you <b>clear the app data</b>, uninstall it or use incognito mode, they are lost."]], ["🛟", "Ayuda · Help", ["<b>No sound?</b> Turn up the media volume and make sure the audio download finished (✅ Audio ready).", "<b>I don't see the new things?</b> Close the app completely and open it again with internet.", "<b>Any other problem?</b> Ask your Spanish teacher: <b>Alberto Garrido Hernández</b>, Old Harbour Primary School."]]];
function guideImgs(box){
  const kind=box.dataset.kind;
  const fig=(svg,es,en,cls)=>{const f=document.createElement("figure");if(cls)f.className=cls;f.innerHTML=svg;const c=document.createElement("figcaption");c.textContent=es+" · "+en;f.append(c);box.append(f);};
  try{
    if(kind==="stadium"||kind==="castle"){const fn=kind==="stadium"?stadiumSVG:castleSVG;
      [[6,"¡Completo!","Complete!"],[1,"Mejora 1","Upgrade 1"],[3,"Mejora 3","Upgrade 3"]].forEach(([st,es,en],ix)=>fig(fn(st,false,(kind==="castle"&&ix===0)?"Mi castillo":undefined),es,en));}
    else if(kind==="coco"){const src=document.querySelector(".mascot .psvg");if(!src){box.remove();return;}
      [["gc-all","Clásicos","Classic"],["gc-all gc-var","Edición de color","Colour edition"]].forEach(([c,es,en])=>{const n=src.cloneNode(true);n.setAttribute("class","psvg "+c);const w=document.createElement("div");w.append(n);fig(w.innerHTML,es,en,"gcoco");});}
  }catch(e){box.remove();}
}
function guideArticle(){
  const art=h("article",{cls:"guide"},h("h1",{},"📖 Cómo usar la app · How to use the app"),h("p",{cls:"gintro"},"Basic Spanish – Extra Lessons · "+APP_VERSION+" · Alberto Garrido Hernández · Old Harbour Primary School"));
  const toc=h("nav",{cls:"gtoc"});GUIDE.forEach(([ic,t],k)=>toc.append(h("a",{href:"#g"+k,on:{click:e=>{e.preventDefault();document.getElementById("g"+k).scrollIntoView({behavior:"smooth"});}}},ic+" "+t)));
  art.append(toc);
  GUIDE.forEach(([ic,t,items],k)=>{const ul=h("ul",{});items.forEach(x=>{const li=h("li",{});li.innerHTML=x;li.querySelectorAll(".gimgs").forEach(guideImgs);ul.append(li);});art.append(h("section",{id:"g"+k},h("h2",{},ic+" "+t),ul));});
  return art;
}
function showGuide(){
  cur=null;hush&&hush();app.innerHTML="";
  app.append(topbar(true),guideArticle(),h("div",{cls:"controls sm noprint"},h("button",{cls:"btn",on:{click:()=>printOnly(document.querySelector(".guide"))}},"🖨️ Imprimir · Print"),h("button",{cls:"btn primary",on:{click:()=>home()}},"← Home")));
  window.scrollTo(0,0);
}

/* Icon + text: when the text wraps, the second line starts under the first letter (not under the icon) */
const HANG_SEL="button,a,p,li,label,h1,h2,h3,div,span";
const EMOJI_START=/^\s*((?:\p{Extended_Pictographic}|\p{Regional_Indicator}|[\u{1F1E6}-\u{1F1FF}0-9#*]\uFE0F?\u20E3)(?:\uFE0F|\u200D(?:\p{Extended_Pictographic})|\p{Emoji_Modifier})*)\s+(\S[\s\S]*)$/u;
function hangOne(el){
  if(el.closest(".hero h1,.here,.teacher,.santahat,.stars,.rbadge,.pmark,.pic,.ric,.ric2,.bic,.cic,.dtop,.mtop,.gface,.hic,.htx>.hic,svg"))return;
  const f=el.firstChild;if(!f||f.nodeType!==3)return;
  if(el.firstElementChild&&el.firstElementChild.classList&&el.firstElementChild.classList.contains("hic"))return;
  const m=EMOJI_START.exec(f.nodeValue);if(!m)return;
  const ic=document.createElement("span");ic.className="hic";ic.textContent=m[1];
  const tx=document.createElement("span");tx.className="htx";tx.append(m[2]);
  f.remove();while(el.firstChild)tx.append(el.firstChild);
  el.append(ic,tx);el.classList.add("hang");
}
function hangAll(root){(root||document).querySelectorAll(HANG_SEL).forEach(hangOne);}
let hangQ=false;new MutationObserver(()=>{if(hangQ)return;hangQ=true;requestAnimationFrame(()=>{hangQ=false;hangAll(document.body);});}).observe(document.documentElement,{childList:true,subtree:true,characterData:true});

const HAT_INFO={"w": 324, "h": 215, "brimCx": 0.6512, "brimBottom": 0.9256, "brimW": 0.6852, "pomBottom": 0.8837, "pomRight": 0.2346};
function placeHat(){
  const el=document.querySelector(".santahat");if(!el)return;if(!el.firstChild)el.innerHTML=SANTA_HAT;
  const sp=el.parentElement,h1=sp.closest("h1"),cs=getComputedStyle(h1);
  const fs=parseFloat(cs.fontSize),lh=parseFloat(cs.lineHeight)||fs*1.1;
  const cv=document.createElement("canvas").getContext("2d");cv.font=cs.fontWeight+" "+cs.fontSize+" "+cs.fontFamily;
  const m=cv.measureText("S"),fA=m.fontBoundingBoxAscent||fs*.9,fD=m.fontBoundingBoxDescent||fs*.25,aA=m.actualBoundingBoxAscent||fs*.72;
  const baseline=(lh-(fA+fD))/2+fA,glyphTop=baseline-aA;
  const gw=(m.actualBoundingBoxRight||fs*.6)+(m.actualBoundingBoxLeft||0),gCx=((m.actualBoundingBoxRight||fs*.6)-(m.actualBoundingBoxLeft||0))/2;
  const W=gw*1.4/HAT_INFO.brimW,H=W*HAT_INFO.h/HAT_INFO.w;el.style.width=W+"px";el.style.height=H+"px";
  el.style.top=(glyphTop-HAT_INFO.brimBottom*H+fs*0.08)+"px";el.style.left=(gCx-HAT_INFO.brimCx*W-fs*0.06)+"px";
  // keep clear of everything above the title (name, rewards, teacher info)
  h1.style.marginTop="";
  const hr=el.getBoundingClientRect();let lowest=-1e9;
  document.querySelectorAll(".tophome *").forEach(e=>{const r=e.getBoundingClientRect();if(r.width&&r.right>hr.left&&r.left<hr.right&&r.bottom>lowest&&r.bottom<=hr.bottom+200)lowest=Math.max(lowest,r.bottom);});
  const gap=hr.top-lowest;if(lowest>-1e9&&gap<6)h1.style.marginTop=(parseFloat(getComputedStyle(h1).marginTop)+6-gap)+"px";
}

const MEDAL_ES={10:"la medalla de bronce 🥉",25:"la medalla de plata 🥈",50:"la medalla de oro 🥇",100:"el trofeo 🏆"};
const MEDAL_EN={10:"the bronze medal 🥉",25:"the silver medal 🥈",50:"the gold medal 🥇",100:"the trophy 🏆"};
function dailyTips(){
  const T=[],t=totalStars();
  for(let i=0;i<28;i++){const d=daysLeft(i);if(isUnlocked(i)&&d!=null&&d<=7&&d>=0)T.push({k:"exp"+i,es:"⏳ Tu Lección "+(i+1)+" se cierra en "+d+(d===1?" día":" días")+". Pídele a tu maestro que la renueve.",en:"Your Lesson "+(i+1)+" closes in "+d+(d===1?" day":" days")+". Ask your teacher to renew it.",go:()=>openUnit(i)});}
  const nx=MEDALS.find(m=>t<m[0]);if(nx&&nx[0]-t<=6)T.push({k:"medal"+nx[0],es:"Te faltan "+(nx[0]-t)+" ⭐ para "+MEDAL_ES[nx[0]]+".",en:"You need "+(nx[0]-t)+" more ⭐ for "+MEDAL_EN[nx[0]]+".",go:()=>showPath()});
  for(let i=0;i<28;i++){if(isUnlocked(i)&&!doneL[i]){T.push({k:"next"+i,es:"Sigue con: "+U[i].i+" "+(i+1)+". "+U[i].t,en:"Continue with Lesson "+(i+1)+": "+U[i].e,go:()=>openUnit(i,"lesson")});break;}}
  for(let i=0;i<28;i++){if(isUnlocked(i)&&doneL[i]&&(prog[i]||0)<3){T.push({k:"quiz"+i,es:"¿Ya hiciste la prueba de la Lección "+(i+1)+"? ¡Gana más ⭐!",en:"Have you taken the quiz of Lesson "+(i+1)+"? Win more ⭐!",go:()=>openUnit(i,"quiz")});break;}}
  if(!doneL[DEMO_IDX])T.push({k:"demo",es:"🎁 Prueba la clase gratis: Los números del 1 al 10.",en:"Try the free lesson: Numbers 1 to 10.",go:()=>openUnit(DEMO_IDX,"lesson")});

  if(nx&&nx[0]-t>6)T.push({k:"path",es:"🗺️ Mira tu camino: te faltan "+(nx[0]-t)+" ⭐ para "+MEDAL_ES[nx[0]]+".",en:"See your path: "+(nx[0]-t)+" more ⭐ for "+MEDAL_EN[nx[0]]+".",go:()=>showPath()});
  T.push({k:"say",es:"🗣️ Repite las palabras en voz alta. ¡Así aprendes más rápido!",en:"Repeat the words out loud. That's how you learn faster!"});

function dailyGreeting(){

/* Quiz */
function timePieces(hh,mm){
  let hr=hh,tail;
  if(mm===0)tail=["en punto"];else if(mm===15)tail=["y cuarto"];else if(mm===30)tail=["y media"];
  else if(mm<30)tail=["y",nw(mm)];else{hr=hh%12+1;tail=["menos",nw(60-mm)];}
  return (hr===1?["Es la una"]:["Son las",nw(hr)]).concat(tail);
}
function timePhrase(hh,mm){
  let hr=hh,tail;
  if(mm===0)tail="en punto";else if(mm===15)tail="y cuarto";else if(mm===30)tail="y media";
  else if(mm<30)tail="y "+nw(mm);else{hr=hh%12+1;tail="menos "+nw(60-mm);}
  return (hr===1?"Es la una":"Son las "+nw(hr))+" "+tail;
}
function makeQuiz(u){
  const pool=items(u), global=ALL.flatMap(items);
  const qs=[];
  const distract=(ans,key)=>{let c=shuffle(pool.filter(x=>x[key]!==ans[key]&&x.es!==ans.es&&x.en!==ans.en));
    if(c.length<3)c=c.concat(shuffle(global.filter(x=>x.g===ans.g?false:x[key]!==ans[key])));
    const out=[],seen=new Set([ans[key]]);for(const x of c){if(!seen.has(x[key])){seen.add(x[key]);out.push(x[key]);}if(out.length===3)break;}return out;};
  const n=10;
  for(let k=0;k<n;k++){
    if(u.special==="math"&&k%2===0){
      const add=Math.random()<.5;let a=1+Math.floor(Math.random()*40),b=1+Math.floor(Math.random()*20);if(!add&&b>a)[a,b]=[b,a];
      const r=add?a+b:a-b,op=add?"más":"menos";
      const right=`${nw(a)} ${op} ${nw(b)} es igual a ${nw(r)}`;
      const wrongs=new Set();while(wrongs.size<3){const d=1+Math.floor(Math.random()*3);const t=pick([0,1,2]);
        const aa=t===0?a+d:a,bb=t===1?b+d:b,rr=t===2?r+d:r;wrongs.add(`${nw(aa)} ${op} ${nw(bb)} es igual a ${nw(rr)}`);}
      qs.push({type:"sym",prompt:"Léelo en español · Read it in Spanish",show:`${a} ${add?"+":"−"} ${b} = ${r}`,ans:right,opts:shuffle([right,...wrongs]),long:true,say:right,pieces:[nw(a),add?"más":"menos",nw(b),"es igual a",nw(r)]});continue;
    }
    if(u.special==="clock"&&k%2===0){
      const hh=1+Math.floor(Math.random()*12),mm=pick([0,15,30,0,5+Math.floor(Math.random()*20),35+Math.floor(Math.random()*20)]);
      const right=timePhrase(hh,mm);const wrongs=new Set();
      while(wrongs.size<3){const w=timePhrase(1+Math.floor(Math.random()*12),pick([0,10,15,20,30,40,45,50]));if(w!==right)wrongs.add(w);}
      qs.push({type:"sym",prompt:"¿Qué hora es? · What time is it?",show:`🕐 ${hh}:${String(mm).padStart(2,"0")}`,ans:right,opts:shuffle([right,...wrongs]),long:true,say:right,pieces:timePieces(hh,mm)});continue;
    }
    if(u.s.length&&Math.random()<.2){const sent=pick(u.s);qs.push({type:"order",sent});continue;}
    const w=pick(pool);
    const types=["en2es","es2en","listen"];if(w.e)types.push("pic","pic");
    const t=pick(types);
    if(t==="es2en"){qs.push({type:t,w,ans:w.en,opts:shuffle([w.en,...distract(w,"en")])});}
    else qs.push({type:t,w,ans:w.es,opts:shuffle([w.es,...distract(w,"es")])});
  }
  return qs;
}
